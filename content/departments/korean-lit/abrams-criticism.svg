<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">문학 비평의 네 좌표: 내재적 관점과 외재적 관점</text>
    <rect x="195" y="45" width="150" height="52" rx="4" fill="#e9e1cf" stroke="#7a766d"/>
    <text x="270" y="66" font-size="12" text-anchor="middle" font-weight="bold">세계 · 현실 (Universe)</text>
    <text x="270" y="86" font-size="10" text-anchor="middle">반영론: 시대·사회 현실의 거울</text>
    <rect x="185" y="130" width="170" height="68" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="270" y="153" font-size="13" text-anchor="middle" font-weight="bold">작품 · 텍스트 (Work)</text>
    <text x="270" y="172" font-size="11" text-anchor="middle" font-weight="bold">절대주의 · 내재적 관점</text>
    <text x="270" y="189" font-size="10" text-anchor="middle">(형식주의 · 신비평 · 구조주의)</text>
    <rect x="20" y="134" width="135" height="60" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="87" y="156" font-size="12" text-anchor="middle" font-weight="bold">작가 (Artist)</text>
    <text x="87" y="174" font-size="10" text-anchor="middle">표현론: 내면·전기·의도</text>
    <rect x="385" y="134" width="135" height="60" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="452" y="156" font-size="12" text-anchor="middle" font-weight="bold">독자 (Audience)</text>
    <text x="452" y="174" font-size="10" text-anchor="middle">효용론: 수용·교훈·감동</text>
    <path d="M270 130 L270 97 M185 164 L155 164 M355 164 L385 164" stroke="#2f5d50" stroke-width="2.5" fill="none"/>
    <rect x="25" y="222" width="490" height="82" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="270" y="242" font-size="12" text-anchor="middle" font-weight="bold">내재적 비평 vs. 외재적 비평의 비교</text>
    <text x="40" y="263" font-size="11" text-anchor="start">• 내재적 비평 (절대주의): 텍스트 밖의 작가·시대·독자를 괄호 치고 작품 안의 운율·역설·서사 구조만 분석</text>
    <text x="40" y="283" font-size="11" text-anchor="start">• 외재적 비평 (반영·표현·효용): 작품을 둘러싼 역사적 현실(반영), 창작 주체(표현), 수용자 반응(효용)과 연결</text>
  </g>
</svg>
