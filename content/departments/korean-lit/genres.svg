<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="400" height="252">
<rect width="400" height="252" fill="#f4efe6"/>
<text x="200" y="22" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">문학의 네 갈래</text>
<rect x="10" y="34" width="185" height="92" rx="6" fill="#ffffff" stroke="#2f5d50" stroke-width="1.5"/>
<text x="102" y="62" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#2f5d50">서정</text>
<text x="102" y="86" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">자기 감정을 노래함</text>
<text x="102" y="108" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#7a766d">예: 시, 시조</text>
<rect x="205" y="34" width="185" height="92" rx="6" fill="#ffffff" stroke="#e07a3f" stroke-width="1.5"/>
<text x="297" y="62" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#e07a3f">서사</text>
<text x="297" y="86" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">사건을 이야기함</text>
<text x="297" y="108" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#7a766d">예: 소설, 설화</text>
<rect x="10" y="138" width="185" height="92" rx="6" fill="#ffffff" stroke="#2f5d50" stroke-width="1.5"/>
<text x="102" y="166" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#2f5d50">극</text>
<text x="102" y="190" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">무대에서 보여 줌</text>
<text x="102" y="212" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#7a766d">예: 희곡, 시나리오</text>
<rect x="205" y="138" width="185" height="92" rx="6" fill="#ffffff" stroke="#e07a3f" stroke-width="1.5"/>
<text x="297" y="166" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#e07a3f">교술</text>
<text x="297" y="190" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">알리고 가르침</text>
<text x="297" y="212" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#7a766d">예: 수필, 일기</text>
<text x="200" y="244" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#7a766d">작품 하나가 두 갈래의 성질을 함께 지니기도 한다</text>
</svg>
