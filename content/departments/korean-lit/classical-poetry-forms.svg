<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">한국 고전시가 갈래의 율격과 형식 비교</text>
    <rect x="20" y="42" width="500" height="28" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="75" y="61" font-size="11" text-anchor="middle" font-weight="bold">갈래 (시대)</text>
    <text x="170" y="61" font-size="11" text-anchor="middle" font-weight="bold">표기 수단</text>
    <text x="285" y="61" font-size="11" text-anchor="middle" font-weight="bold">기본 율격·구절</text>
    <text x="430" y="61" font-size="11" text-anchor="middle" font-weight="bold">형식적 특징 및 낙구/종장</text>
    <rect x="20" y="70" width="500" height="42" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="75" y="96" font-size="11" text-anchor="middle" font-weight="bold">10구체 향가 (신라)</text>
    <text x="170" y="96" font-size="11" text-anchor="middle">향찰 (한자 차자)</text>
    <text x="285" y="96" font-size="11" text-anchor="middle" font-weight="bold">4구 + 4구 + 2구 (3단)</text>
    <text x="430" y="96" font-size="10" text-anchor="middle">낙구(9구) 첫머리에 감탄사 (아으 등)</text>
    <rect x="20" y="112" width="500" height="42" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="75" y="138" font-size="11" text-anchor="middle" font-weight="bold">고려가요 (고려)</text>
    <text x="170" y="138" font-size="11" text-anchor="middle">구전 → 한글 기록</text>
    <text x="285" y="138" font-size="11" text-anchor="middle" font-weight="bold">3음보 · 분연체(연 구분)</text>
    <text x="430" y="138" font-size="10" text-anchor="middle">여음·후렴구 발달 (남녀상열·이별)</text>
    <rect x="20" y="154" width="500" height="42" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="75" y="180" font-size="11" text-anchor="middle" font-weight="bold">평시조 (고려말~조선)</text>
    <text x="170" y="180" font-size="11" text-anchor="middle">한글 · 국한문</text>
    <text x="285" y="180" font-size="11" text-anchor="middle" font-weight="bold">4음보 · 3장 6구 45자 내외</text>
    <text x="430" y="180" font-size="10" text-anchor="middle">종장 첫 음보 3음절 고정 (3·5·4·3)</text>
    <rect x="20" y="196" width="500" height="42" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="75" y="222" font-size="11" text-anchor="middle" font-weight="bold">가사 (조선 전기~후기)</text>
    <text x="170" y="222" font-size="11" text-anchor="middle">한글 · 국한문</text>
    <text x="285" y="222" font-size="11" text-anchor="middle" font-weight="bold">4음보 연속체 (행 수 무제한)</text>
    <text x="430" y="222" font-size="10" text-anchor="middle">마지막 행이 시조 종장(3·5·4·3)이면 정격가사</text>
    <rect x="20" y="248" width="500" height="56" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="270" y="268" font-size="11" text-anchor="middle" font-weight="bold">율격과 종장 규칙의 연속성: 10구체 향가 낙구 감탄사 → 시조 종장 첫 음보(3음절 고정) → 정격가사 결사</text>
    <text x="270" y="288" font-size="11" text-anchor="middle">조선 후기 사설시조는 중장이 길어져 정형을 벗어나도 종장 첫 음보 3음절 규칙은 대체로 유지한다.</text>
  </g>
</svg>
