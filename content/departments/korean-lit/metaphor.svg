<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
<rect width="400" height="250" fill="#f4efe6"/>
<text x="200" y="22" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">은유: 한 대상을 다른 대상에 빗대기</text>
<rect x="15" y="50" width="130" height="70" rx="6" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="80" y="76" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#2f5d50">원관념</text>
<text x="80" y="102" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">내 마음</text>
<rect x="255" y="50" width="130" height="70" rx="6" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="320" y="76" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#e07a3f">보조관념</text>
<text x="320" y="102" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">빈 찻잔</text>
<line x1="150" y1="85" x2="250" y2="85" stroke="#7a766d" stroke-width="2"/>
<text x="200" y="74" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#7a766d">빗댐</text>
<rect x="60" y="145" width="280" height="50" rx="6" fill="#2f5d50" fill-opacity="0.12" stroke="#2f5d50" stroke-width="1.5"/>
<text x="200" y="166" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#2f5d50">둘의 닮은 점</text>
<text x="200" y="184" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">비어 있음, 그래도 온기가 남음</text>
<line x1="80" y1="122" x2="120" y2="145" stroke="#7a766d" stroke-width="1.2"/>
<line x1="320" y1="122" x2="280" y2="145" stroke="#7a766d" stroke-width="1.2"/>
<text x="200" y="224" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#7a766d">직유는 처럼, 같이 같은 말을 써서 빗대는 방법</text>
</svg>
