<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="380" height="260">
<rect width="380" height="260" fill="#f4efe6"/>
<text x="190.0" y="22.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">세 영역으로 본 한 아이의 과제</text>
<circle cx="130.0" cy="140.0" r="105" fill="#ffffff" stroke="#7a766d" stroke-width="1.5"/>
<circle cx="130.0" cy="140.0" r="70" fill="#f6e3d6" stroke="#e07a3f" stroke-width="2"/>
<circle cx="130.0" cy="140.0" r="36" fill="#2f5d50" stroke="none" stroke-width="1.5"/>
<text x="130.0" y="136.0" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">혼자</text>
<text x="130.0" y="152.0" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">할 수 있음</text>
<text x="130.0" y="90.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">도움을 받으면</text>
<text x="130.0" y="196.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">할 수 있음</text>
<text x="130.0" y="58.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">도움을 받아도</text>
<text x="130.0" y="230.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">아직 어려움</text>
<rect x="250.0" y="70.0" width="14.0" height="14.0" rx="4" fill="#2f5d50" stroke="none" stroke-width="1.5"/>
<text x="270.0" y="82.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">안쪽 원</text>
<rect x="250.0" y="100.0" width="14.0" height="14.0" rx="4" fill="#f6e3d6" stroke="#e07a3f" stroke-width="2"/>
<text x="270.0" y="112.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">가운데 고리</text>
<rect x="250.0" y="130.0" width="14.0" height="14.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="1.5"/>
<text x="270.0" y="142.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">바깥 고리</text>
<text x="250.0" y="180.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="start">경계는 고정되지 않고</text>
<text x="250.0" y="196.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="start">배움에 따라 바깥으로</text>
<text x="250.0" y="212.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="start">넓어진다</text>
</svg>
