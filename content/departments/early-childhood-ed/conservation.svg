<text x="308.0" y="148.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">C</text>
<text x="262.0" y="168.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">"C가 더 많아요. 물이 더 높잖아요"</text>
<line x1="20.0" y1="184.0" x2="360.0" y2="184.0" stroke="#7a766d" stroke-width="1" stroke-dasharray="4 3"/>
<text x="190.0" y="204.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">아이는 두 컵에서 무엇을 보고 판단했을까?</text>
<text x="190.0" y="224.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">붓는 동안 물을 더하거나 덜지 않았다</text>
