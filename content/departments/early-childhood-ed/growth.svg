<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220">
  <rect width="380" height="220" fill="#f4efe6"/>
  <text x="190" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">같은 나이, 다른 걸음 (가상의 세 아이)</text>
  <text x="190" y="44" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a766d">가위로 선을 따라 자르기를 처음 해낸 시기</text>
  <g font-family="sans-serif" font-size="12" fill="#1d1c1a">
    <text x="12" y="79">하린</text><text x="12" y="119">도윤</text><text x="12" y="159">서아</text>
  </g>
  <rect x="126" y="62" width="65" height="24" fill="#2f5d50"/>
  <rect x="204" y="102" width="78" height="24" fill="#e07a3f"/>
  <rect x="295" y="142" width="65" height="24" fill="#7a766d"/>
  <line x1="100" y1="176" x2="360" y2="176" stroke="#1d1c1a" stroke-width="2"/>
  <g stroke="#1d1c1a" stroke-width="2"><line x1="100" y1="172" x2="100" y2="180"/><line x1="230" y1="172" x2="230" y2="180"/><line x1="360" y1="172" x2="360" y2="180"/></g>
  <g font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">
    <text x="100" y="196">만 3세</text><text x="230" y="196">만 4세</text><text x="360" y="196">만 5세</text>
  </g>
  <text x="190" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a766d">막대는 그 시기가 이른 때부터 늦은 때까지의 폭이다</text>
</svg>
