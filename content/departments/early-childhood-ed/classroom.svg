<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 292" width="380" height="292">
  <rect width="380" height="292" fill="#f4efe6"/>
  <text x="190" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">가상의 교실 배치도 (위에서 본 모습)</text>
  <rect x="10" y="34" width="360" height="226" fill="#ffffff" stroke="#1d1c1a" stroke-width="2"/>
  <line x1="20" y1="260" x2="70" y2="260" stroke="#e07a3f" stroke-width="5"/>
  <g font-family="sans-serif" fill="#1d1c1a" text-anchor="middle">
    <rect x="20" y="44" width="110" height="70" fill="#f4efe6" stroke="#2f5d50" stroke-width="2"/>
    <text x="75" y="70" font-size="12" font-weight="bold">쌓기 영역</text><text x="75" y="92" font-size="11" fill="#7a766d">소리가 날 수 있음</text>
    <rect x="140" y="44" width="110" height="70" fill="#f4efe6" stroke="#2f5d50" stroke-width="2"/>
    <text x="195" y="70" font-size="12" font-weight="bold">역할 영역</text><text x="195" y="92" font-size="11" fill="#7a766d">함께 하는 놀이</text>
    <rect x="260" y="44" width="100" height="70" fill="#f4efe6" stroke="#2f5d50" stroke-width="2"/>
    <text x="310" y="70" font-size="12" font-weight="bold">미술 영역</text><text x="310" y="92" font-size="11" fill="#7a766d">손으로 만들기</text>
    <rect x="140" y="132" width="110" height="118" fill="none" stroke="#7a766d" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="195" y="188" font-size="12" font-weight="bold">모임 공간</text><text x="195" y="208" font-size="11" fill="#7a766d">다 같이 모이는 곳</text>
    <rect x="20" y="180" width="110" height="70" fill="#f4efe6" stroke="#e07a3f" stroke-width="2"/>
    <text x="75" y="206" font-size="12" font-weight="bold">조작 영역</text><text x="75" y="228" font-size="11" fill="#7a766d">퍼즐 · 끼우기</text>
    <rect x="260" y="150" width="100" height="100" fill="#f4efe6" stroke="#e07a3f" stroke-width="2"/>
    <text x="310" y="196" font-size="12" font-weight="bold">책 영역</text><text x="310" y="218" font-size="11" fill="#7a766d">조용히 보기</text>
    <text x="45" y="282" font-size="11" fill="#1d1c1a">출입문</text>
