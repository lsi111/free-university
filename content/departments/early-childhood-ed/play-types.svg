<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 252" width="380" height="252">
  <rect width="380" height="252" fill="#f4efe6"/>
  <text x="190" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">놀이의 네 유형과 장면 예</text>
  <g font-family="sans-serif" font-size="12" fill="#1d1c1a">
    <rect x="12" y="38" width="356" height="46" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
    <rect x="12" y="38" width="96" height="46" fill="#2f5d50"/>
    <text x="60" y="66" text-anchor="middle" fill="#ffffff" font-weight="bold">기능놀이</text>
    <text x="120" y="57" font-weight="bold">같은 동작을 되풀이한다</text><text x="120" y="75" font-size="11" fill="#7a766d">공을 굴렸다 잡았다 한다</text>
    <rect x="12" y="90" width="356" height="46" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
    <rect x="12" y="90" width="96" height="46" fill="#2f5d50"/>
    <text x="60" y="118" text-anchor="middle" fill="#ffffff" font-weight="bold">구성놀이</text>
    <text x="120" y="109" font-weight="bold">무엇인가를 쌓고 만든다</text><text x="120" y="127" font-size="11" fill="#7a766d">블록으로 탑을 올린다</text>
    <rect x="12" y="142" width="356" height="46" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
    <rect x="12" y="142" width="96" height="46" fill="#e07a3f"/>
    <text x="60" y="170" text-anchor="middle" fill="#1d1c1a" font-weight="bold">상징놀이</text>
    <text x="120" y="161" font-weight="bold">다른 것인 척한다</text><text x="120" y="179" font-size="11" fill="#7a766d">빈 컵으로 차를 대접하는 척한다</text>
    <rect x="12" y="194" width="356" height="46" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
    <rect x="12" y="194" width="96" height="46" fill="#7a766d"/>
    <text x="60" y="222" text-anchor="middle" fill="#ffffff" font-weight="bold">규칙놀이</text>
    <text x="120" y="213" font-weight="bold">정해진 규칙을 따른다</text><text x="120" y="231" font-size="11" fill="#7a766d">차례를 지켜 카드 놀이를 한다</text>
  </g>
</svg>
