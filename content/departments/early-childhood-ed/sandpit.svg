<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 246" width="380" height="246">
  <rect width="380" height="246" fill="#f4efe6"/>
  <text x="190" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">가상의 장면: 모래놀이 터, 오전 10시 무렵</text>
  <rect x="30" y="40" width="296" height="110" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
  <g font-family="sans-serif" fill="#1d1c1a" text-anchor="middle">
    <text x="178" y="58" font-size="11" fill="#7a766d">모래놀이 터</text>
    <circle cx="90" cy="100" r="15" fill="#2f5d50"/><text x="90" y="105" font-size="12" font-weight="bold" fill="#ffffff">가</text>
    <rect x="60" y="124" width="22" height="16" fill="#e07a3f"/><text x="120" y="136" font-size="11">양동이</text>
    <circle cx="240" cy="100" r="15" fill="#e07a3f"/><text x="240" y="105" font-size="12" font-weight="bold">나</text>
    <line x1="222" y1="100" x2="110" y2="100" stroke="#1d1c1a" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="166" y="92" font-size="11">삽을 내민다</text>
    <circle cx="352" cy="100" r="15" fill="#ffffff" stroke="#7a766d" stroke-width="2"/><text x="352" y="105" font-size="12" font-weight="bold">다</text>
    <text x="352" y="128" font-size="11" fill="#7a766d">지켜봄</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#1d1c1a">
    <text x="30" y="178">10:20  가: 삽으로 양동이에 모래를 채운다.</text>
    <text x="30" y="198">10:22  나: 가에게 삽을 내민다. 가가 받는다.</text>
    <text x="30" y="218">10:24  다: 터 밖에서 두 아이를 본다. 말은 없다.</text>
  </g>
</svg>
