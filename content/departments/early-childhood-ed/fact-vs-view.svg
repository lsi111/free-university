<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 246" width="380" height="246">
  <rect width="380" height="246" fill="#f4efe6"/>
  <text x="190" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">관찰 기록의 두 칸 (가상 기록)</text>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="97" y="52" text-anchor="middle" font-size="12" font-weight="bold">본 것과 들은 것</text>
    <text x="283" y="52" text-anchor="middle" font-size="12" font-weight="bold">생각한 것</text>
    <rect x="12" y="62" width="170" height="48" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
    <text x="22" y="82" font-size="11">탑이 무너지자 민준은</text><text x="22" y="98" font-size="11">다시 쌓았다</text>
    <rect x="198" y="62" width="170" height="48" fill="#ffffff" stroke="#e07a3f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="208" y="90" font-size="11">끈기가 있는 아이다</text>
    <rect x="12" y="120" width="170" height="48" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
    <text x="22" y="140" font-size="11">옆 친구에게 블록</text><text x="22" y="156" font-size="11">하나를 내밀었다</text>
    <rect x="198" y="120" width="170" height="48" fill="#ffffff" stroke="#e07a3f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="208" y="148" font-size="11">친구를 좋아한다</text>
    <rect x="12" y="178" width="170" height="48" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
    <text x="22" y="198" font-size="11">"어, 또 넘어졌네"</text><text x="22" y="214" font-size="11">라고 말했다</text>
    <rect x="198" y="178" width="170" height="48" fill="#ffffff" stroke="#e07a3f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="208" y="206" font-size="11">실망한 것 같다</text>
    <text x="190" y="90" text-anchor="middle" font-size="12" fill="#7a766d">→</text>
    <text x="190" y="148" text-anchor="middle" font-size="12" fill="#7a766d">→</text>
    <text x="190" y="206" text-anchor="middle" font-size="12" fill="#7a766d">→</text>
    <text x="190" y="241" text-anchor="middle" font-size="11" fill="#7a766d">해석은 가능한 설명 중 하나일 뿐이다</text>
  </g>
</svg>
