<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="380" height="290">
<rect width="380" height="290" fill="#f4efe6"/>
<text x="190" y="22" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">가나라 의회 선거 결과 (가상)</text>
<text x="190" y="40" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">득표수 단위: 천 표, 선거구마다 1석</text>
<rect x="15" y="50" width="350" height="30" fill="#fffaf0" stroke="#7a766d"/>
<rect x="15" y="80" width="350" height="150" fill="#fffaf0" stroke="#7a766d"/>
<rect x="15" y="230" width="350" height="30" fill="#fffaf0" stroke="#7a766d"/>
<line x1="85" y1="50" x2="85" y2="260" stroke="#7a766d"/><line x1="160" y1="50" x2="160" y2="260" stroke="#7a766d"/><line x1="235" y1="50" x2="235" y2="260" stroke="#7a766d"/><line x1="310" y1="50" x2="310" y2="260" stroke="#7a766d"/>
<line x1="15" y1="110" x2="365" y2="110" stroke="#7a766d"/><line x1="15" y1="140" x2="365" y2="140" stroke="#7a766d"/><line x1="15" y1="170" x2="365" y2="170" stroke="#7a766d"/><line x1="15" y1="200" x2="365" y2="200" stroke="#7a766d"/>
<g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">
<text x="50" y="70">선거구</text><text x="122" y="70">알파당</text><text x="197" y="70">베타당</text><text x="272" y="70">감마당</text><text x="337" y="70">당선</text>
<text x="50" y="100">1선거구</text><text x="122" y="100">45</text><text x="197" y="100">35</text><text x="272" y="100">20</text><text x="337" y="100">알파당</text>
<text x="50" y="130">2선거구</text><text x="122" y="130">40</text><text x="197" y="130">30</text><text x="272" y="130">30</text><text x="337" y="130">알파당</text>
<text x="50" y="160">3선거구</text><text x="122" y="160">30</text><text x="197" y="160">40</text><text x="272" y="160">30</text><text x="337" y="160">베타당</text>
<text x="50" y="190">4선거구</text><text x="122" y="190">40</text><text x="197" y="190">25</text><text x="272" y="190">35</text><text x="337" y="190">알파당</text>
<text x="50" y="220">5선거구</text><text x="122" y="220">45</text><text x="197" y="220">20</text><text x="272" y="220">35</text><text x="337" y="220">알파당</text>
<text x="50" y="250">전국 합계</text><text x="122" y="250">200</text><text x="197" y="250">150</text><text x="272" y="250">150</text><text x="337" y="250">-</text>
</g>
<text x="190" y="281" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">전국 합계 득표수는 모두 500천 표이다</text>
</svg>
