<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="380" height="290">
<rect width="380" height="290" fill="#f4efe6"/>
<text x="190" y="26" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">정치체제의 연속선 (가상의 네 나라)</text>
<line x1="30" y1="95" x2="350" y2="95" stroke="#7a766d" stroke-width="2"/>
<circle cx="50" cy="95" r="9" fill="#7a766d"/><circle cx="140" cy="95" r="9" fill="#e07a3f"/><circle cx="230" cy="95" r="9" fill="#e07a3f"/><circle cx="320" cy="95" r="9" fill="#2f5d50"/>
<text x="50" y="72" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">마바국</text>
<text x="140" y="72" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">다라국</text>
<text x="230" y="72" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">라마국</text>
<text x="320" y="72" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">가나라</text>
<text x="30" y="126" font-family="sans-serif" font-size="12" fill="#1d1c1a">경쟁·견제 약함</text>
<text x="350" y="126" font-family="sans-serif" font-size="12" text-anchor="end" fill="#1d1c1a">경쟁·견제 강함</text>
<line x1="15" y1="144" x2="365" y2="144" stroke="#7a766d" stroke-dasharray="4 4"/>
<text x="15" y="170" font-family="sans-serif" font-size="12" fill="#1d1c1a">마바국: 정당 하나만 허용, 선거에 경쟁이 없다</text>
<text x="15" y="198" font-family="sans-serif" font-size="12" fill="#1d1c1a">다라국: 선거는 열리나 야당 활동이 크게 제한된다</text>
<text x="15" y="226" font-family="sans-serif" font-size="12" fill="#1d1c1a">라마국: 경쟁 선거가 있으나 언론이 일부 제한된다</text>
<text x="15" y="254" font-family="sans-serif" font-size="12" fill="#1d1c1a">가나라: 경쟁 선거와 정권 교체, 자유권 보장</text>
<text x="15" y="278" font-family="sans-serif" font-size="11" fill="#7a766d">※ 정도의 차이를 단순하게 나타낸 그림이다</text>
</svg>
