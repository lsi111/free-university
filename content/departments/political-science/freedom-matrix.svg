<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<rect width="400" height="300" fill="#f4efe6"/>
<text x="200.0" y="22.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">간섭과 지배의 네 경우</text>
<rect x="120.0" y="38.0" width="270.0" height="254.0" rx="0" fill="none" stroke="#7a766d" stroke-width="1"/>
<line x1="255.0" y1="38.0" x2="255.0" y2="292.0" stroke="#7a766d" stroke-width="1"/>
<line x1="10.0" y1="88.0" x2="390.0" y2="88.0" stroke="#7a766d" stroke-width="1"/>
<line x1="10.0" y1="190.0" x2="390.0" y2="190.0" stroke="#7a766d" stroke-width="1"/>
<text x="187.5" y="60.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">실제로 간섭</text>
<text x="187.5" y="76.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">한다</text>
<text x="322.5" y="60.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">실제로 간섭</text>
<text x="322.5" y="76.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">하지 않는다</text>
<text x="14.0" y="118.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">자의적으로</text>
<text x="14.0" y="134.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">간섭할 힘을</text>
<text x="14.0" y="150.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">가진 이가</text>
<text x="14.0" y="166.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">있다</text>
<text x="14.0" y="222.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">그런 힘을</text>
<text x="14.0" y="238.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">가진 이가</text>
<text x="14.0" y="254.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">없다</text>
<text x="130.0" y="108.0" font-family="sans-serif" font-size="13" fill="#2f5d50" text-anchor="start" font-weight="bold">ㄱ</text>
<text x="130.0" y="130.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">주인이 변덕으로</text>
<text x="130.0" y="146.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">하인의 일을 막는다</text>
<text x="265.0" y="108.0" font-family="sans-serif" font-size="13" fill="#2f5d50" text-anchor="start" font-weight="bold">ㄴ</text>
<text x="265.0" y="130.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">너그러운 주인이</text>
<text x="265.0" y="146.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">하인을 방해하지</text>
<text x="265.0" y="162.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">않고 지낸다</text>
<text x="130.0" y="210.0" font-family="sans-serif" font-size="13" fill="#2f5d50" text-anchor="start" font-weight="bold">ㄷ</text>
<text x="130.0" y="232.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">시민이 통제하는</text>
<text x="130.0" y="248.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">법이 위반자에게</text>
<text x="130.0" y="264.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">벌금을 물린다</text>
<text x="265.0" y="210.0" font-family="sans-serif" font-size="13" fill="#2f5d50" text-anchor="start" font-weight="bold">ㄹ</text>
<text x="265.0" y="232.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">누구도 간섭하지</text>
<text x="265.0" y="248.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">않고, 간섭할 힘을</text>
<text x="265.0" y="264.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">가진 이도 없다</text>
</svg>
