<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="sans-serif">
  <rect width="360" height="330" fill="#f4efe6"/>
  <rect x="30" y="12" width="290" height="48" rx="8" fill="none" stroke="#2f5d50" stroke-width="2"/>
  <text x="44" y="32" font-size="14" font-weight="700" fill="#2f5d50">① 문제 인식</text>
  <text x="44" y="50" font-size="12" fill="#1d1c1a">필통이 낡았다고 느낀다</text>
  <line x1="175" y1="60" x2="175" y2="72" stroke="#7a766d" stroke-width="2"/>
  <polygon points="169,67 181,67 175,74" fill="#7a766d"/>
