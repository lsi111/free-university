  <text x="44" y="94" font-size="14" font-weight="700" fill="#2f5d50">② 정보 탐색</text>
  <text x="44" y="112" font-size="12" fill="#1d1c1a">후기와 가게 정보를 찾아본다</text>
  <line x1="175" y1="122" x2="175" y2="134" stroke="#7a766d" stroke-width="2"/>
  <polygon points="169,129 181,129 175,136" fill="#7a766d"/>
  <rect x="30" y="136" width="290" height="48" rx="8" fill="none" stroke="#2f5d50" stroke-width="2"/>
  <text x="44" y="156" font-size="14" font-weight="700" fill="#2f5d50">③ 대안 평가</text>
  <text x="44" y="174" font-size="12" fill="#1d1c1a">가격과 품질을 견주어 본다</text>
  <line x1="175" y1="184" x2="175" y2="196" stroke="#7a766d" stroke-width="2"/>
  <polygon points="169,191 181,191 175,198" fill="#7a766d"/>
