  <text x="44" y="298" font-size="12" fill="#1d1c1a">만족·불만이 다음 구매에 영향</text>
  <path d="M320 284 H340 V36 H326" fill="none" stroke="#e07a3f" stroke-width="2" stroke-dasharray="4 3"/>
