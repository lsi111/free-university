  <text x="44" y="218" font-size="14" font-weight="700" fill="#2f5d50">④ 구매</text>
  <text x="44" y="236" font-size="12" fill="#1d1c1a">하나를 골라 값을 치른다</text>
  <line x1="175" y1="246" x2="175" y2="258" stroke="#7a766d" stroke-width="2"/>
  <polygon points="169,253 181,253 175,260" fill="#7a766d"/>
