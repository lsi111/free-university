<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" font-family="sans-serif">
  <rect width="360" height="260" fill="#f4efe6"/>
  <text x="180" y="26" font-size="14" font-weight="700" fill="#1d1c1a" text-anchor="middle">브랜드를 이루는 세 겹</text>
  <rect x="20" y="42" width="320" height="56" rx="8" fill="none" stroke="#e07a3f" stroke-width="2"/>
  <text x="34" y="64" font-size="14" font-weight="700" fill="#e07a3f">머릿속 연상</text>
  <text x="34" y="85" font-size="12" fill="#1d1c1a">고객이 그 이름에서 떠올리는 이미지와 기대</text>
  <rect x="20" y="108" width="320" height="56" rx="8" fill="none" stroke="#2f5d50" stroke-width="2"/>
  <text x="34" y="130" font-size="14" font-weight="700" fill="#2f5d50">이름과 상징</text>
  <text x="34" y="151" font-size="12" fill="#1d1c1a">이름 · 로고 · 색 · 말투처럼 눈에 보이는 표지</text>
  <rect x="20" y="174" width="320" height="56" rx="8" fill="none" stroke="#7a766d" stroke-width="2"/>
  <text x="34" y="196" font-size="14" font-weight="700" fill="#1d1c1a">실제 경험</text>
  <text x="34" y="217" font-size="12" fill="#1d1c1a">제품 · 서비스 · 응대가 약속대로 이어지는가</text>
  <text x="180" y="250" font-size="11" fill="#7a766d" text-anchor="middle">경험이 쌓여 연상이 되고, 상징이 그것을 떠올리게 한다</text>
</svg>
