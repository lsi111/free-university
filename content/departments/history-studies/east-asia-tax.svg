<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">중국 왕조 조세·역(役) 제도의 4단계 전환</text>
    <rect x="20" y="48" width="118" height="175" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="79" y="70" font-size="11" text-anchor="middle" font-weight="bold" fill="#1d1c1a">당 전기: 조용조</text>
    <text x="79" y="98" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[배경]</text>
    <text x="79" y="114" font-size="10" text-anchor="middle">균전제 기반 인두세</text>
    <text x="79" y="142" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[부과 기준]</text>
    <text x="79" y="158" font-size="10" text-anchor="middle">성인 남성(정남) 기준</text>
    <text x="79" y="186" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[납부 방식]</text>
    <text x="79" y="202" font-size="10" text-anchor="middle">곡물(조)·직물(용)·노동(조)</text>
    <path d="M138 135 L147 135" stroke="#e07a3f" stroke-width="2"/>
    <rect x="147" y="48" width="118" height="175" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="206" y="70" font-size="11" text-anchor="middle" font-weight="bold" fill="#1d1c1a">당 후기(780): 양세법</text>
    <text x="206" y="98" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[배경]</text>
    <text x="206" y="114" font-size="10" text-anchor="middle">장원 확대·균전 붕괴</text>
    <text x="206" y="142" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[부과 기준]</text>
    <text x="206" y="158" font-size="10" text-anchor="middle">호(가구)의 자산·토지 기준</text>
    <text x="206" y="186" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[납부 방식]</text>
    <text x="206" y="202" font-size="10" text-anchor="middle">여름·가을 2회 징수</text>
    <path d="M265 135 L274 135" stroke="#e07a3f" stroke-width="2"/>
    <rect x="274" y="48" width="118" height="175" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="333" y="70" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">명 후반: 일조편법</text>
    <text x="333" y="98" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[배경]</text>
    <text x="333" y="114" font-size="10" text-anchor="middle">은 경제·상품화폐 발달</text>
    <text x="333" y="142" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[부과 기준]</text>
    <text x="333" y="158" font-size="10" text-anchor="middle">토지(지) + 인듯세(정) 통합</text>
    <text x="333" y="186" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[납부 방식]</text>
    <text x="333" y="202" font-size="10" text-anchor="middle">은(銀)으로 일괄 납부</text>
    <path d="M392 135 L401 135" stroke="#e07a3f" stroke-width="2"/>
    <rect x="401" y="48" width="118" height="175" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="460" y="70" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">청 옹정제: 지정은제</text>
    <text x="460" y="98" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[배경]</text>
    <text x="460" y="114" font-size="10" text-anchor="middle">강희제 성세자생인정 고정</text>
    <text x="460" y="142" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[부과 기준]</text>
    <text x="460" y="158" font-size="10" text-anchor="middle">정세(인두세)를 토지세에 완전 합산</text>
    <text x="460" y="186" font-size="10" text-anchor="middle" font-weight="bold" fill="#7a766d">[납부 방식]</text>
    <text x="460" y="202" font-size="10" text-anchor="middle">무토지 농민 인두세 소멸</text>
    <rect x="20" y="240" width="500" height="60" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="270" y="262" font-size="11" text-anchor="middle" font-weight="bold">장기 추세: 인신 지배(사람 머릿수 기준 현물·노동 징발) → 재산·토지 기준 화폐(은) 납부</text>
    <text x="270" y="284" font-size="11" text-anchor="middle">결과: 호구 은닉 유인이 줄어 청대 공식 인구가 급증(1억 → 4억)하고 농민 이동이 자유로워짐</text>
  </g>
</svg>
