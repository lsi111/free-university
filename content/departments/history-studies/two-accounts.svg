<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220">
  <rect width="380" height="220" fill="#f4efe6"/>
  <g font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">
    <rect x="60" y="12" width="260" height="30" fill="none" stroke="#7a766d" stroke-width="2"/>
    <text x="190" y="32">같은 사건: 나루 뱃삯이 두 배가 됨</text>
    <path d="M110 44 L85 70 M270 44 L295 70" stroke="#1d1c1a" stroke-width="2"/>
    <rect x="15" y="72" width="170" height="86" fill="none" stroke="#2f5d50" stroke-width="2"/>
    <text x="100" y="92">사공 쪽 기록</text>
    <text x="100" y="112" font-size="11">표현: 수리비 분담</text>
    <text x="100" y="130" font-size="11">강조: 부서진 배</text>
    <text x="100" y="148" font-size="11">빠진 말: 대기 시간</text>
    <rect x="195" y="72" width="170" height="86" fill="none" stroke="#e07a3f" stroke-width="2"/>
    <text x="280" y="92">장사꾼 쪽 기록</text>
    <text x="280" y="112" font-size="11">표현: 갑자기 두 배</text>
    <text x="280" y="130" font-size="11">강조: 늘어난 부담</text>
    <text x="280" y="148" font-size="11">빠진 말: 수리 사정</text>
    <text x="190" y="184">고른 말, 강조, 빠진 말이</text>
    <text x="190" y="202">다르면 인상이 달라진다</text>
  </g>
</svg>
