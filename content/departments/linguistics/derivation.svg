<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250">
<rect width="380" height="250" fill="#f4efe6"/>
<text x="190.0" y="24.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">규칙 적용 순서 (위에서 아래로 읽는 표)</text>
<text x="62.0" y="52.0" font-family="sans-serif" font-size="12" fill="#2f5d50" text-anchor="middle" font-weight="bold">기저형</text>
<text x="148.0" y="52.0" font-family="sans-serif" font-size="12" fill="#2f5d50" text-anchor="middle" font-weight="bold">1) 종성 중화</text>
<text x="245.0" y="52.0" font-family="sans-serif" font-size="12" fill="#2f5d50" text-anchor="middle" font-weight="bold">2) 비음화</text>
<text x="325.0" y="52.0" font-family="sans-serif" font-size="12" fill="#2f5d50" text-anchor="middle" font-weight="bold">표면형</text>
<line x1="15.0" y1="62.0" x2="365.0" y2="62.0" stroke="#7a766d" stroke-width="1.2"/>
<rect x="15.0" y="70.0" width="350.0" height="34.0" rx="0" fill="#ece5d6" stroke="none" stroke-width="0"/>
<text x="62.0" y="90.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">앞+말</text>
<text x="148.0" y="90.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">압말</text>
<text x="245.0" y="90.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">암말</text>
<text x="325.0" y="90.0" font-family="sans-serif" font-size="13" fill="#e07a3f" text-anchor="middle" font-weight="bold">[암말]</text>
<text x="62.0" y="128.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">꽃+말</text>
<text x="148.0" y="128.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">꼳말</text>
<text x="245.0" y="128.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">꼰말</text>
<text x="325.0" y="128.0" font-family="sans-serif" font-size="13" fill="#e07a3f" text-anchor="middle" font-weight="bold">[꼰말]</text>
<rect x="15.0" y="146.0" width="350.0" height="34.0" rx="0" fill="#ece5d6" stroke="none" stroke-width="0"/>
<text x="62.0" y="166.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">부엌+문</text>
<text x="148.0" y="166.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">부억문</text>
<text x="245.0" y="166.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">부엉문</text>
<text x="325.0" y="166.0" font-family="sans-serif" font-size="13" fill="#e07a3f" text-anchor="middle" font-weight="bold">[부엉문]</text>
<text x="62.0" y="204.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">숯+물</text>
<text x="148.0" y="204.0" font-family="sans-serif" font-size="13" fill="#e07a3f" text-anchor="middle" font-weight="bold">?</text>
<text x="245.0" y="204.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">순물</text>
<text x="325.0" y="204.0" font-family="sans-serif" font-size="13" fill="#e07a3f" text-anchor="middle" font-weight="bold">[순물]</text>
<line x1="15.0" y1="220.0" x2="365.0" y2="220.0" stroke="#7a766d" stroke-width="1.2"/>
<text x="15.0" y="240.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="start">왼쪽 칸의 결과가 오른쪽 규칙의 입력이 된다.</text>
<text x="15.0" y="256.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="start">표기는 철자에 가깝게 적은 근사이다.</text>
