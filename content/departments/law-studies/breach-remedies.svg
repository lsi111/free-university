<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">후발적 이행장애: 귀책사유에 따른 채무불이행과 위험부담</text>
    <rect x="30" y="45" width="480" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="90" y="65" font-size="12" text-anchor="middle" font-weight="bold">상황 구분</text>
    <text x="215" y="65" font-size="12" text-anchor="middle" font-weight="bold">귀책사유 소재</text>
    <text x="330" y="65" font-size="12" text-anchor="middle" font-weight="bold">법적 성질</text>
    <text x="445" y="65" font-size="12" text-anchor="middle" font-weight="bold">핵심 법적 효과</text>
    <rect x="30" y="75" width="480" height="44" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="90" y="101" font-size="11" text-anchor="middle" font-weight="bold">이행 가능 + 지연</text>
    <text x="215" y="101" font-size="11" text-anchor="middle">채무자 책임</text>
    <text x="330" y="101" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">이행지체</text>
    <text x="445" y="101" font-size="10" text-anchor="middle">상당 기간 최고 후 해제 + 손해배상</text>
    <rect x="30" y="119" width="480" height="44" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="90" y="145" font-size="11" text-anchor="middle" font-weight="bold">후발적 불능</text>
    <text x="215" y="145" font-size="11" text-anchor="middle">채무자 책임</text>
    <text x="330" y="145" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">이행불능</text>
    <text x="445" y="145" font-size="10" text-anchor="middle">최고 없이 즉시 해제 + 손해배상</text>
    <rect x="30" y="163" width="480" height="44" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="90" y="189" font-size="11" text-anchor="middle" font-weight="bold">후발적 불능</text>
    <text x="215" y="189" font-size="11" text-anchor="middle">쌍방 무책임(천재지변)</text>
    <text x="330" y="189" font-size="12" text-anchor="middle" font-weight="bold" fill="#e07a3f">채무자 위험부담</text>
    <text x="445" y="189" font-size="10" text-anchor="middle">채무자 대금청구 불가(손해배상 없음)</text>
    <rect x="30" y="207" width="480" height="44" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="90" y="233" font-size="11" text-anchor="middle" font-weight="bold">후발적 불능</text>
    <text x="215" y="233" font-size="11" text-anchor="middle">채권자 책임(수령지체 중)</text>
    <text x="330" y="233" font-size="12" text-anchor="middle" font-weight="bold" fill="#e07a3f">채권자 위험부담</text>
    <text x="445" y="233" font-size="10" text-anchor="middle">채무자(매도인)는 대금 청구 가능</text>
    <rect x="30" y="263" width="480" height="42" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="270" y="281" font-size="11" text-anchor="middle" font-weight="bold">핵심 구별: 채무자에게 고의·과실(귀책사유)이 있으면 채무불이행(손해배상 발생),</text>
    <text x="270" y="297" font-size="11" text-anchor="middle">양쪽 모두에게 과실이 없으면 위험부담(민법 제537조 채무자위험부담주의 원칙) 문제로 해결</text>
  </g>
</svg>
