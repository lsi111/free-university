<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
<rect width="400" height="260" fill="#f4efe6"/>
<text x="200" y="22" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">가나라 법의 위계 (가상)</text>
<rect x="120" y="40" width="160" height="50" fill="#2f5d50"/>
<rect x="80" y="100" width="240" height="50" fill="#e07a3f"/>
<rect x="40" y="160" width="320" height="50" fill="#fffaf0" stroke="#7a766d" stroke-width="2"/>
<g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
<text x="200" y="60" fill="#fffaf0">헌법</text>
<text x="200" y="125" fill="#1d1c1a">법률</text>
<text x="200" y="185" fill="#1d1c1a">명령</text>
</g>
<g font-family="sans-serif" font-size="11" text-anchor="middle">
<text x="200" y="77" fill="#fffaf0">나라의 기본 질서를 정한다</text>
<text x="200" y="141" fill="#1d1c1a">의회가 만든다</text>
<text x="200" y="201" fill="#1d1c1a">행정부가 만든다</text>
</g>
<text x="200" y="232" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">위에 있는 법이 아래에 있는 법보다 우선한다</text>
<text x="200" y="250" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">(위로 갈수록 효력이 강하다)</text>
</svg>
