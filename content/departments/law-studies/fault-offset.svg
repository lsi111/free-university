<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
<rect width="400" height="250" fill="#f4efe6"/>
<text x="200.0" y="24.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">사고 손해와 과실 (가상, 단위 만 원)</text>
<text x="40.0" y="50.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">손해 항목</text>
<rect x="40.0" y="58.0" width="128.0" height="36.0" rx="2" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="104.0" y="81.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">치료비 800</text>
<rect x="168.0" y="58.0" width="192.0" height="36.0" rx="2" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="264.0" y="81.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">차량 수리비 1,200</text>
<text x="40.0" y="130.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">사고 상황</text>
<text x="50.0" y="154.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">보행자 A: 횡단 신호를 어김, 과실 25%</text>
<text x="50.0" y="176.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">운전자 B: 속도를 지키지 않음, 과실 75%</text>
<line x1="40.0" y1="196.0" x2="360.0" y2="196.0" stroke="#7a766d" stroke-width="1" stroke-dasharray="4 3"/>
<text x="200.0" y="220.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">A가 B에게 배상을 청구하는 경우를 생각한다</text>
</svg>
