<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290">
<rect width="400" height="290" fill="#f4efe6"/>
<text x="200.0" y="24.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">경매대금의 배당 (가상, 단위 만 원)</text>
<text x="40.0" y="50.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">경매대금 6,500</text>
<rect x="40.0" y="58.0" width="325.0" height="28.0" rx="2" fill="#2f5d50" fill-opacity="0.25" stroke="#2f5d50" stroke-width="1.5"/>
<text x="40.0" y="112.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">저당권 채권 (설정 순서대로)</text>
<rect x="40.0" y="120.0" width="200.0" height="36.0" rx="2" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="140.0" y="143.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">1순위 4,000</text>
<rect x="240.0" y="120.0" width="150.0" height="36.0" rx="2" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="315.0" y="143.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">2순위 3,000</text>
<line x1="365.0" y1="54.0" x2="365.0" y2="168.0" stroke="#e07a3f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="390.0" y="186.0" font-family="sans-serif" font-size="11" fill="#e07a3f" text-anchor="end">경매대금은 여기서 끝난다</text>
<rect x="40.0" y="204.0" width="350.0" height="34.0" rx="2" fill="#fffaf0" stroke="#7a766d" stroke-width="1.2"/>
<text x="215.0" y="226.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">일반채권자(저당권 없음)의 채권: 2,000</text>
<text x="200.0" y="272.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">순위대로 먼저 받고, 남은 돈이 있어야 일반채권자가 받는다</text>
</svg>
