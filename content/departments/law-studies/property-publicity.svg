<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">물권변동의 공시방법과 공신력(선의취득) 비교</text>
    <rect x="30" y="48" width="230" height="175" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="145" y="72" font-size="14" text-anchor="middle" font-weight="bold">부동산 (토지 · 건물)</text>
    <rect x="48" y="86" width="194" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="145" y="108" font-size="12" text-anchor="middle" font-weight="bold">공시방법: 등기 (제186조)</text>
    <rect x="48" y="128" width="194" height="42" rx="4" fill="#fbe6e1" stroke="#b3261e"/>
    <text x="145" y="146" font-size="12" text-anchor="middle" font-weight="bold" fill="#b3261e">공신력: 부정 (불인정)</text>
    <text x="145" y="162" font-size="10" text-anchor="middle">위조 등기 믿은 매수인 보호 안 됨</text>
    <text x="145" y="192" font-size="11" text-anchor="middle" font-weight="bold">→ 진정한 소유자의 정적 안전 우선</text>
    <text x="145" y="210" font-size="10" text-anchor="middle">(단, 통정허위표시 등 개별 규정 보호)</text>
    <rect x="280" y="48" width="230" height="175" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="395" y="72" font-size="14" text-anchor="middle" font-weight="bold">동산 (물건 · 기계 등)</text>
    <rect x="298" y="86" width="194" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="395" y="108" font-size="12" text-anchor="middle" font-weight="bold">공시방법: 인도/점유 (제188조)</text>
    <rect x="298" y="128" width="194" height="42" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="395" y="146" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">공신력: 인정 (선의취득, 제249조)</text>
    <text x="395" y="162" font-size="10" text-anchor="middle">평온·공연·선의·무과실 양수인 취득</text>
    <text x="395" y="192" font-size="11" text-anchor="middle" font-weight="bold">→ 거래의 동적 안전 우선</text>
    <text x="395" y="210" font-size="10" text-anchor="middle">(도품·유실물은 2년간 반환청구 특칙)</text>
    <rect x="30" y="238" width="480" height="64" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="270" y="258" font-size="11" text-anchor="middle" font-weight="bold">성립요건주의(형식주의): 매매계약만으로는 소유권이 이전되지 않으며,</text>
    <text x="270" y="276" font-size="11" text-anchor="middle">반드시 공시방법(부동산은 등기, 동산은 인도)을 갖추어야 물권변동 효력이 발생한다.</text>
    <text x="270" y="294" font-size="10" text-anchor="middle">예외: 상속·판결·경매·공용징수 등 법률 규정에 의한 취득(제187조)은 등기 없이 취득(처분 시엔 등기 필요)</text>
  </g>
</svg>
