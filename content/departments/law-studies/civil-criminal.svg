<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
<rect width="400" height="220" fill="#f4efe6"/>
<text x="200" y="22" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">민사 재판과 형사 재판 (가상)</text>
<rect x="10" y="40" width="185" height="130" fill="#fffaf0" stroke="#2f5d50" stroke-width="2"/>
<rect x="205" y="40" width="185" height="130" fill="#fffaf0" stroke="#e07a3f" stroke-width="2"/>
<g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">
<text x="102" y="63">민사 재판</text><text x="297" y="63">형사 재판</text>
</g>
<g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">
<text x="102" y="92">원고와 피고</text><text x="297" y="92">검사와 피고인</text>
<text x="102" y="118">권리가 있는가?</text><text x="297" y="118">죄가 되는가?</text>
<text x="102" y="144">예: 대금 지급 명령</text><text x="297" y="144">예: 형벌 선고</text>
</g>
<g font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">
<text x="200" y="190">원고는 소를 낸 쪽이고,</text>
<text x="200" y="207">검사는 국가를 대표해 기소하는 쪽이다</text>
</g>
</svg>
