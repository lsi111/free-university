<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290">
<rect width="400" height="290" fill="#f4efe6"/>
<text x="200.0" y="24.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">행정작용에 대한 구제 수단 (가상)</text>
<rect x="20.0" y="44.0" width="150.0" height="56.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="95.0" y="68.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">위법한 처분</text>
<text x="95.0" y="87.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">효력을 없애고 싶다</text>
<line x1="170.0" y1="72.0" x2="230.0" y2="72.0" stroke="#2f5d50" stroke-width="2"/>
<polygon points="230.0,72.0 222.6,75.1 222.6,68.9" fill="#2f5d50"/>
<rect x="230.0" y="44.0" width="150.0" height="56.0" rx="4" fill="#fffaf0" stroke="#e07a3f" stroke-width="2"/>
<text x="305.0" y="68.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">취소소송</text>
<text x="305.0" y="87.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">제소기간 안에 제기</text>
<rect x="20.0" y="120.0" width="150.0" height="56.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="95.0" y="144.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">위법한 직무집행</text>
<text x="95.0" y="163.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">손해가 생겼다</text>
<line x1="170.0" y1="148.0" x2="230.0" y2="148.0" stroke="#2f5d50" stroke-width="2"/>
<polygon points="230.0,148.0 222.6,151.1 222.6,144.9" fill="#2f5d50"/>
<rect x="230.0" y="120.0" width="150.0" height="56.0" rx="4" fill="#fffaf0" stroke="#e07a3f" stroke-width="2"/>
<text x="305.0" y="144.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">국가배상</text>
<text x="305.0" y="163.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">손해를 메우는 배상</text>
<rect x="20.0" y="196.0" width="150.0" height="56.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="95.0" y="220.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">적법한 공권력 행사</text>
<text x="95.0" y="239.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">특별한 희생이 생겼다</text>
<line x1="170.0" y1="224.0" x2="230.0" y2="224.0" stroke="#2f5d50" stroke-width="2"/>
<polygon points="230.0,224.0 222.6,227.1 222.6,220.9" fill="#2f5d50"/>
<rect x="230.0" y="196.0" width="150.0" height="56.0" rx="4" fill="#fffaf0" stroke="#e07a3f" stroke-width="2"/>
<text x="305.0" y="220.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">손실보상</text>
<text x="305.0" y="239.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">정당한 보상</text>
<text x="200.0" y="276.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">위법이면 취소나 배상, 적법이면 보상</text>
</svg>
