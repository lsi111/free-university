<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
<rect width="400" height="280" fill="#f4efe6"/>
<text x="200" y="22" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">도덕과 법이 겹치는 모양 (가나라, 가상)</text>
<circle cx="145" cy="150" r="110" fill="#2f5d50" fill-opacity="0.18" stroke="#2f5d50" stroke-width="2"/>
<circle cx="255" cy="150" r="110" fill="#e07a3f" fill-opacity="0.18" stroke="#e07a3f" stroke-width="2"/>
<text x="90" y="80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">도덕</text>
<text x="310" y="80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">법</text>
<g font-family="sans-serif" font-size="11" text-anchor="middle" fill="#1d1c1a">
<text x="90" y="135">고마운 사람에게</text>
<text x="90" y="152">감사 인사</text>
<text x="90" y="169">하기</text>
<text x="200" y="135">남의 물건을</text>
<text x="200" y="152">훔치지</text>
<text x="200" y="169">않기</text>
<text x="310" y="135">자동차는</text>
<text x="310" y="152">오른쪽으로</text>
<text x="310" y="169">통행하기</text>
</g>
<text x="200" y="272" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">가운데 겹친 부분은 도덕과 법이 모두 요구하는 행동이다</text>
</svg>
