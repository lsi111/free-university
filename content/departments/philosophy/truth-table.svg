<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">조건문 p → q 의 진리표와 네 가지 추론</text>
    <rect x="30" y="45" width="200" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="60" y="66" font-size="13" text-anchor="middle" font-weight="bold">p</text>
    <text x="130" y="66" font-size="13" text-anchor="middle" font-weight="bold">q</text>
    <text x="200" y="66" font-size="13" text-anchor="middle" font-weight="bold">p → q</text>
    <rect x="30" y="75" width="200" height="32" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="96" font-size="13" text-anchor="middle" font-weight="bold">T</text>
    <text x="130" y="96" font-size="13" text-anchor="middle" font-weight="bold">T</text>
    <text x="200" y="96" font-size="13" text-anchor="middle" font-weight="bold">T</text>
    <rect x="30" y="107" width="200" height="32" rx="4" fill="#fff3f0" stroke="#7a766d"/>
    <text x="60" y="128" font-size="13" text-anchor="middle" font-weight="bold">T</text>
    <text x="130" y="128" font-size="13" text-anchor="middle" font-weight="bold">F</text>
    <text x="200" y="128" font-size="13" text-anchor="middle" font-weight="bold" fill="#b3261e">F</text>
    <rect x="30" y="139" width="200" height="32" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="160" font-size="13" text-anchor="middle" font-weight="bold">F</text>
    <text x="130" y="160" font-size="13" text-anchor="middle" font-weight="bold">T</text>
    <text x="200" y="160" font-size="13" text-anchor="middle" font-weight="bold">T</text>
    <rect x="30" y="171" width="200" height="32" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="192" font-size="13" text-anchor="middle" font-weight="bold">F</text>
    <text x="130" y="192" font-size="13" text-anchor="middle" font-weight="bold">F</text>
    <text x="200" y="192" font-size="13" text-anchor="middle" font-weight="bold">T</text>
    <text x="30" y="225" font-size="11" text-anchor="start" fill="#b3261e">거짓이 되는 줄은 오직 한 줄: 앞이 참, 뒤가 거짓</text>
    <rect x="260" y="45" width="250" height="62" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="272" y="66" font-size="12" text-anchor="start" font-weight="bold">긍정식(MP): p → q, p ⊢ q  (타당)</text>
    <text x="272" y="88" font-size="12" text-anchor="start" font-weight="bold">후건 부정식(MT): p → q, ¬q ⊢ ¬p  (타당)</text>
    <rect x="260" y="120" width="250" height="62" rx="4" fill="#fbe6e1" stroke="#b3261e"/>
    <text x="272" y="141" font-size="12" text-anchor="start" font-weight="bold">후건 긍정의 오류: p → q, q ⊢ p  (부당)</text>
    <text x="272" y="163" font-size="12" text-anchor="start" font-weight="bold">전건 부정의 오류: p → q, ¬p ⊢ ¬q  (부당)</text>
    <text x="260" y="215" font-size="11" text-anchor="start">예) 비가 오면 땅이 젖는다. 땅이 젖었다.</text>
    <text x="260" y="232" font-size="11" text-anchor="start">그러나 비가 왔다고 결론할 수는 없다(스프링클러).</text>
    <text x="270" y="290" font-size="12" text-anchor="middle" font-weight="bold">n개의 명제 기호가 있으면 진리표의 줄은 2ⁿ개</text>
  </g>
</svg>
