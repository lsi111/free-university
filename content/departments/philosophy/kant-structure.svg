<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">칸트의 인식 구조: 감성 → 지성 → 경험</text>
    <rect x="20" y="60" width="130" height="70" rx="4" fill="#e9e1cf" stroke="#7a766d"/>
    <text x="85" y="85" font-size="13" text-anchor="middle" font-weight="bold">물자체</text>
    <text x="85" y="105" font-size="11" text-anchor="middle">(인식할 수 없음)</text>
    <rect x="190" y="45" width="150" height="45" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="265" y="65" font-size="13" text-anchor="middle" font-weight="bold">감성의 형식</text>
    <text x="265" y="82" font-size="11" text-anchor="middle">공간 · 시간</text>
    <rect x="190" y="110" width="150" height="45" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="265" y="130" font-size="13" text-anchor="middle" font-weight="bold">지성의 형식</text>
    <text x="265" y="147" font-size="11" text-anchor="middle">12범주 (인과 · 실체 등)</text>
    <rect x="380" y="75" width="140" height="60" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="450" y="100" font-size="13" text-anchor="middle" font-weight="bold">현상 = 경험</text>
    <text x="450" y="118" font-size="11" text-anchor="middle">(인식 가능한 세계)</text>
    <path d="M150 95 L190 68 M150 95 L190 130 M340 68 L380 95 M340 130 L380 115" stroke="#7a766d" stroke-width="2" fill="none"/>
    <text x="270" y="200" font-size="13" text-anchor="middle" font-weight="bold">내용 없는 사고는 공허하고,</text>
    <text x="270" y="220" font-size="13" text-anchor="middle" font-weight="bold">개념 없는 직관은 맹목이다.</text>
    <text x="270" y="255" font-size="11" text-anchor="middle">합리론: 이성이 지식의 원천  /  경험론: 감각이 지식의 원천</text>
    <text x="270" y="275" font-size="11" text-anchor="middle">칸트: 소재는 경험에서, 형식은 마음에서 → 둘의 종합</text>
  </g>
</svg>
