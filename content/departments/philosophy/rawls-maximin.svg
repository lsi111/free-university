<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">무지의 베일 뒤의 선택: maximin 규칙</text>
    <rect x="30" y="45" width="330" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="55" y="66" font-size="11" text-anchor="middle" font-weight="bold">분배안</text>
    <text x="132" y="66" font-size="11" text-anchor="middle" font-weight="bold">최상위층</text>
    <text x="194" y="66" font-size="11" text-anchor="middle" font-weight="bold">중간층</text>
    <text x="256" y="66" font-size="11" text-anchor="middle" font-weight="bold">최하위층</text>
    <text x="318" y="66" font-size="11" text-anchor="middle" font-weight="bold">최솟값</text>
    <rect x="30" y="75" width="330" height="36" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="55" y="98" font-size="13" text-anchor="middle" font-weight="bold">A</text>
    <text x="132" y="98" font-size="13" text-anchor="middle">90</text>
    <text x="194" y="98" font-size="13" text-anchor="middle">40</text>
    <text x="256" y="98" font-size="13" text-anchor="middle">10</text>
    <text x="318" y="98" font-size="13" text-anchor="middle" font-weight="bold">10</text>
    <rect x="30" y="111" width="330" height="36" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="55" y="134" font-size="13" text-anchor="middle" font-weight="bold">B</text>
    <text x="132" y="134" font-size="13" text-anchor="middle">60</text>
    <text x="194" y="134" font-size="13" text-anchor="middle">50</text>
    <text x="256" y="134" font-size="13" text-anchor="middle">30</text>
    <text x="318" y="134" font-size="13" text-anchor="middle" font-weight="bold">30</text>
    <rect x="30" y="147" width="330" height="36" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="55" y="170" font-size="13" text-anchor="middle" font-weight="bold">C</text>
    <text x="132" y="170" font-size="13" text-anchor="middle">45</text>
    <text x="194" y="170" font-size="13" text-anchor="middle">45</text>
    <text x="256" y="170" font-size="13" text-anchor="middle">45</text>
    <text x="318" y="170" font-size="13" text-anchor="middle" font-weight="bold">45</text>
    <text x="30" y="205" font-size="11" text-anchor="start">각 분배안의 가장 불리한 위치의 몫을 비교해 그 최솟값이</text>
    <text x="30" y="222" font-size="11" text-anchor="start">가장 큰 안을 고른다(maximin).</text>
    <rect x="385" y="45" width="135" height="160" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="452" y="68" font-size="13" text-anchor="middle" font-weight="bold">무지의 베일</text>
    <text x="452" y="92" font-size="10" text-anchor="middle">자신의 계층·재능·</text>
    <text x="452" y="112" font-size="10" text-anchor="middle">가치관을 모른다</text>
    <text x="452" y="132" font-size="10" text-anchor="middle">→ 누구든 최하위층이</text>
    <text x="452" y="152" font-size="10" text-anchor="middle">될 수 있다고 가정</text>
    <text x="452" y="172" font-size="10" text-anchor="middle">→ 최악을 대비한 선택</text>
    <text x="270" y="275" font-size="11" text-anchor="middle" font-weight="bold">제1원칙: 평등한 기본적 자유   제2원칙: 기회균등 + 차등의 원칙</text>
    <text x="270" y="297" font-size="11" text-anchor="middle">차등의 원칙: 불평등은 최소수혜자에게 최대 이익일 때만 허용</text>
  </g>
</svg>
