<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">성리학의 이기론과 사단칠정 논변</text>
    <rect x="190" y="45" width="160" height="50" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="270" y="66" font-size="14" text-anchor="middle" font-weight="bold">이(理)</text>
    <text x="270" y="84" font-size="11" text-anchor="middle">원리 · 본성 · 법칙</text>
    <rect x="190" y="115" width="160" height="50" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="270" y="136" font-size="14" text-anchor="middle" font-weight="bold">기(氣)</text>
    <text x="270" y="154" font-size="11" text-anchor="middle">질료 · 에너지 · 현상</text>
    <path d="M270 95 L270 115" stroke="#7a766d" stroke-width="2"/>
    <text x="285" y="110" font-size="10" text-anchor="start">불상리 · 불상잡</text>
    <rect x="20" y="190" width="240" height="100" rx="4" fill="#f4e9d6" stroke="#7a766d"/>
    <text x="140" y="212" font-size="13" text-anchor="middle" font-weight="bold">이황: 이기호발설</text>
    <text x="140" y="234" font-size="10" text-anchor="middle">사단은 이가 발하고 기가 따른다</text>
    <text x="140" y="251" font-size="10" text-anchor="middle">칠정은 기가 발하고 이가 탄다</text>
    <text x="140" y="268" font-size="10" text-anchor="middle">→ 사단과 칠정을 구분해 도덕성 강조</text>
    <text x="140" y="285" font-size="10" text-anchor="middle">(주리론의 경향)</text>
    <rect x="280" y="190" width="240" height="100" rx="4" fill="#f4e9d6" stroke="#7a766d"/>
    <text x="400" y="212" font-size="13" text-anchor="middle" font-weight="bold">이이: 기발이승일도설</text>
    <text x="400" y="234" font-size="10" text-anchor="middle">발하는 것은 언제나 기이고</text>
    <text x="400" y="251" font-size="10" text-anchor="middle">이는 그 원리로 올라탈 뿐이다</text>
    <text x="400" y="268" font-size="10" text-anchor="middle">→ 사단은 칠정 중 선한 것</text>
    <text x="400" y="285" font-size="10" text-anchor="middle">(주기론의 경향)</text>
  </g>
</svg>
