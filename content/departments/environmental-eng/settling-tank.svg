<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290">
<rect width="400" height="290" fill="#f4efe6"/>
<text x="16.0" y="22.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="start" font-weight="bold">이상적 장방형 침전지 (옆에서 본 단면)</text>
<rect x="70.0" y="60.0" width="260.0" height="120.0" rx="0" fill="#e3ebe6" stroke="#2f5d50" stroke-width="2"/>
<line x1="16.0" y1="72.0" x2="68.0" y2="72.0" stroke="#e07a3f" stroke-width="2"/>
<polygon points="68.0,72.0 60.6,75.1 60.6,68.9" fill="#e07a3f"/>
<text x="16.0" y="54.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">유입 Q</text>
<line x1="332.0" y1="72.0" x2="392.0" y2="72.0" stroke="#e07a3f" stroke-width="2"/>
<polygon points="392.0,72.0 384.6,75.1 384.6,68.9" fill="#e07a3f"/>
<text x="392.0" y="54.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="end">유출</text>
<line x1="70.0" y1="60.0" x2="330.0" y2="180.0" stroke="#e07a3f" stroke-width="2.5"/>
<line x1="80.0" y1="202.0" x2="110.0" y2="202.0" stroke="#e07a3f" stroke-width="2.5"/>
<text x="118.0" y="206.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">침강속도 v₀ 입자 (유출구 바닥에 도달)</text>
<line x1="70.0" y1="60.0" x2="330.0" y2="120.0" stroke="#7a766d" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="80.0" y1="222.0" x2="110.0" y2="222.0" stroke="#7a766d" stroke-width="2" stroke-dasharray="5,4"/>
<text x="118.0" y="226.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">침강속도가 v₀보다 작은 입자</text>
<line x1="56.0" y1="60.0" x2="56.0" y2="180.0" stroke="#1d1c1a" stroke-width="1"/>
<text x="52.0" y="124.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="end">깊이</text>
<text x="200.0" y="254.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">유입 유량 Q = 3600 m³/d</text>
<text x="200.0" y="274.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">수면 면적 A = 200 m²</text>
</svg>
