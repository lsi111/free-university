<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
<rect width="400" height="320" fill="#f4efe6"/>
<text x="20" y="20" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">환경영향평가의 단순화한 흐름</text>
<rect x="20" y="34" width="170" height="36" rx="6" fill="#cfd8cf" stroke="#2f5d50" stroke-width="1.5"/>
<text x="105.0" y="56.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">1 현황 조사</text>
<text x="205" y="56" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">지금 무엇이 있나</text>
<line x1="105" y1="70" x2="105.0" y2="79.0" stroke="#e07a3f" stroke-width="2"/>
<polygon points="105,88 100.5,79.0 109.5,79.0" fill="#e07a3f"/>
<rect x="20" y="88" width="170" height="36" rx="6" fill="#cfd8cf" stroke="#2f5d50" stroke-width="1.5"/>
<text x="105.0" y="110.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">2 영향 예측</text>
<text x="205" y="110" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">사업 후 어떻게 달라지나</text>
<line x1="105" y1="124" x2="105.0" y2="133.0" stroke="#e07a3f" stroke-width="2"/>
<polygon points="105,142 100.5,133.0 109.5,133.0" fill="#e07a3f"/>
<rect x="20" y="142" width="170" height="36" rx="6" fill="#cfd8cf" stroke="#2f5d50" stroke-width="1.5"/>
<text x="105.0" y="164.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">3 저감 방안 마련</text>
<text x="205" y="164" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">줄일 방법은 무엇인가</text>
<line x1="105" y1="178" x2="105.0" y2="187.0" stroke="#e07a3f" stroke-width="2"/>
<polygon points="105,196 100.5,187.0 109.5,187.0" fill="#e07a3f"/>
<rect x="20" y="196" width="170" height="36" rx="6" fill="#cfd8cf" stroke="#2f5d50" stroke-width="1.5"/>
<text x="105.0" y="218.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">4 의견 수렴</text>
<text x="205" y="218" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">주민·전문가는 어떻게 보나</text>
<line x1="105" y1="232" x2="105.0" y2="241.0" stroke="#e07a3f" stroke-width="2"/>
<polygon points="105,250 100.5,241.0 109.5,241.0" fill="#e07a3f"/>
<rect x="20" y="250" width="170" height="36" rx="6" fill="#cfd8cf" stroke="#2f5d50" stroke-width="1.5"/>
<text x="105.0" y="272.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">5 결정</text>
<text x="205" y="272" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">허가·조건부·보완 등</text>
<text x="20" y="308" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">실제 절차와 순서는 나라와 사업마다 다르다.</text>
</svg>
