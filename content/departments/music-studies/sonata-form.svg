<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
<rect width="400" height="240" fill="#f4efe6"/>
<text x="200.0" y="22.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">고전 소나타 형식(Sonata Form)의 3부 서사 다이어그램</text>
<rect x="30.0" y="48.0" width="110.0" height="140.0" rx="3" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="85.0" y="70.0" font-family="sans-serif" font-size="11" fill="#2f5d50" text-anchor="middle" font-weight="bold">제시부 (Exposition)</text>
<text x="85.0" y="95.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">제1주제 (으뜸조 I)</text>
<text x="85.0" y="115.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">↓ 경과구 (전조)</text>
<text x="85.0" y="135.0" font-family="sans-serif" font-size="10" fill="#e07a3f" text-anchor="middle" font-weight="bold">제2주제 (딸림조 V)</text>
<text x="85.0" y="155.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">소종결 (V)</text>
<text x="85.0" y="178.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">(반복 연주)</text>
<rect x="148.0" y="48.0" width="104.0" height="140.0" rx="3" fill="#ffffff" stroke="#e53e3e" stroke-width="2"/>
<text x="200.0" y="70.0" font-family="sans-serif" font-size="10" fill="#e53e3e" text-anchor="middle" font-weight="bold">발전부 (Development)</text>
<text x="200.0" y="95.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">동기 분해·변형</text>
<text x="200.0" y="115.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">빈번한 전조</text>
<text x="200.0" y="135.0" font-family="sans-serif" font-size="10" fill="#e53e3e" text-anchor="middle">극적 갈등·긴장</text>
<text x="200.0" y="155.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">도미넌트 페달</text>
<text x="200.0" y="178.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">재현부 준비</text>
<rect x="260.0" y="48.0" width="110.0" height="140.0" rx="3" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="315.0" y="70.0" font-family="sans-serif" font-size="10" fill="#2f5d50" text-anchor="middle" font-weight="bold">재현부 (Recapitulation)</text>
<text x="315.0" y="95.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">제1주제 (으뜸조 I)</text>
<text x="315.0" y="115.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">경과구 (전조 없음)</text>
<text x="315.0" y="135.0" font-family="sans-serif" font-size="10" fill="#2f5d50" text-anchor="middle" font-weight="bold">제2주제 (으뜸조 I)</text>
<text x="315.0" y="155.0" font-family="sans-serif" font-size="9" fill="#2f5d50" text-anchor="middle" font-weight="bold">조문화해 (Tonal Unity)</text>
<text x="315.0" y="178.0" font-family="sans-serif" font-size="9" fill="#1d1c1a" text-anchor="middle">코다 Coda (종결부)</text>
<text x="200.0" y="205.0" font-family="sans-serif" font-size="10" fill="#2f5d50" text-anchor="middle" font-weight="bold">핵심 포인트: 제시부에서 갈라졌던 제2주제가 재현부에서 '으뜸조(I)'로 돌아와 화해함</text>
<text x="200.0" y="225.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">조성의 대립(I vs V) → 갈등 심화 → 조성적 통일(I &amp; I)의 헤겔식 변증법 구조</text>
</svg>
