<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
<rect width="400" height="240" fill="#f4efe6"/>
<text x="200.0" y="22.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">기능화성 체계(T-S-D)와 4대 종지(Cadence) 구조</text>
<rect x="30.0" y="50.0" width="95.0" height="65.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="77.0" y="72.0" font-family="sans-serif" font-size="12" fill="#2f5d50" text-anchor="middle" font-weight="bold">토닉 (T)</text>
<text x="77.0" y="88.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">안정·해결 (I, vi)</text>
<text x="77.0" y="102.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">으뜸화음</text>
<rect x="155.0" y="50.0" width="95.0" height="65.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="202.0" y="72.0" font-family="sans-serif" font-size="11" fill="#e07a3f" text-anchor="middle" font-weight="bold">서브도미넌트 (S)</text>
<text x="202.0" y="88.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">이탈·준비 (IV, ii)</text>
<text x="202.0" y="102.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">버금딸림화음</text>
<rect x="275.0" y="50.0" width="95.0" height="65.0" rx="4" fill="#ffffff" stroke="#e53e3e" stroke-width="2"/>
<text x="322.0" y="72.0" font-family="sans-serif" font-size="12" fill="#e53e3e" text-anchor="middle" font-weight="bold">도미넌트 (D)</text>
<text x="322.0" y="88.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">최고 긴장 (V, vii°)</text>
<text x="322.0" y="102.0" font-family="sans-serif" font-size="9" fill="#7a766d" text-anchor="middle">딸림화음 (이끔음)</text>
<line x1="125.0" y1="75.0" x2="155.0" y2="75.0" stroke="#e07a3f" stroke-width="1.5"/>
<polygon points="155.0,75.0 147.6,78.1 147.6,71.9" fill="#e07a3f"/>
<line x1="250.0" y1="75.0" x2="275.0" y2="75.0" stroke="#e53e3e" stroke-width="1.5"/>
<polygon points="275.0,75.0 267.6,78.1 267.6,71.9" fill="#e53e3e"/>
<polyline points="322.0,115.0 322.0,130.0 77.0,130.0 77.0,115.0" fill="none" stroke="#2f5d50" stroke-width="2"/>
<line x1="80.0" y1="120.0" x2="77.0" y2="115.0" stroke="#2f5d50" stroke-width="2"/>
<polygon points="77.0,115.0 83.5,119.7 78.1,122.9" fill="#2f5d50"/>
<text x="200.0" y="126.0" font-family="sans-serif" font-size="10" fill="#2f5d50" text-anchor="middle" font-weight="bold">해결 진행 (D → T)</text>
<rect x="30.0" y="145.0" width="340.0" height="80.0" rx="3" fill="#ffffff" stroke="#1d1c1a" stroke-width="1.5"/>
<text x="40.0" y="163.0" font-family="sans-serif" font-size="10" fill="#2f5d50" text-anchor="start" font-weight="bold">1. 정격종지 (Authentic): D → T (V → I)  | 가장 완전하고 확고한 마침</text>
<text x="40.0" y="179.0" font-family="sans-serif" font-size="10" fill="#e07a3f" text-anchor="start">2. 변격종지 (Plagal): S → T (IV → I)     | 부드러운 여운의 '아멘 종지'</text>
<text x="40.0" y="195.0" font-family="sans-serif" font-size="10" fill="#e53e3e" text-anchor="start">3. 반종지 (Half): ? → D (? → V)          | 딸림화음으로 멈추어 질문을 던짐</text>
<text x="40.0" y="211.0" font-family="sans-serif" font-size="10" fill="#7a766d" text-anchor="start">4. 위종지 (Deceptive): D → vi (V → vi)   | 으뜸 대신 6도로 빠져 기대를 배반</text>
</svg>
