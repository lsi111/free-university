<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="25" font-size="15" text-anchor="middle" font-weight="bold">크리스탈러 중심지 이론: 성립 조건과 포섭 원리(K=3, 4, 7)</text>
    <rect x="20" y="42" width="230" height="175" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="135" y="62" font-size="13" text-anchor="middle" font-weight="bold">중심 기능의 성립 조건</text>
    <circle cx="135" cy="132" r="62" fill="#fdf0d5" stroke="#e07a3f" stroke-width="2"/>
    <circle cx="135" cy="132" r="36" fill="#e3efe9" stroke="#2f5d50" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="135" cy="132" r="5" fill="#1d1c1a"/>
    <text x="135" y="122" font-size="11" text-anchor="middle" font-weight="bold">중심지</text>
    <text x="135" y="152" font-size="10" text-anchor="middle" font-weight="bold" fill="#2f5d50">최소요구치(Threshold)</text>
    <text x="135" y="84" font-size="11" text-anchor="middle" font-weight="bold" fill="#e07a3f">재화의 도달거리(Range)</text>
    <text x="135" y="208" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">성립 조건: 최소요구치 ≤ 도달거리</text>
    <rect x="265" y="42" width="255" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="305" y="62" font-size="12" text-anchor="middle" font-weight="bold">체계</text>
    <text x="375" y="62" font-size="12" text-anchor="middle" font-weight="bold">원리</text>
    <text x="465" y="62" font-size="12" text-anchor="middle" font-weight="bold">저차 중심지 위치</text>
    <rect x="265" y="72" width="255" height="48" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="305" y="101" font-size="13" text-anchor="middle" font-weight="bold" fill="#2f5d50">K = 3</text>
    <text x="375" y="101" font-size="12" text-anchor="middle" font-weight="bold">시장 원리</text>
    <text x="465" y="101" font-size="10" text-anchor="middle">육각형 꼭짓점 (1+6×1/3)</text>
    <rect x="265" y="120" width="255" height="48" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="305" y="149" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1c1a">K = 4</text>
    <text x="375" y="149" font-size="12" text-anchor="middle" font-weight="bold">교통 원리</text>
    <text x="465" y="149" font-size="10" text-anchor="middle">변의 중점 (1+6×1/2)</text>
    <rect x="265" y="168" width="255" height="48" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="305" y="197" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1c1a">K = 7</text>
    <text x="375" y="197" font-size="12" text-anchor="middle" font-weight="bold">행정 원리</text>
    <text x="465" y="197" font-size="10" text-anchor="middle">육각형 내부 완전 포섭</text>
    <rect x="20" y="232" width="500" height="68" rx="4" fill="#e9e1cf" stroke="#7a766d"/>
    <text x="270" y="254" font-size="11" text-anchor="middle" font-weight="bold">저차 중심지(편의점): 최소요구치·도달거리 작음 → 좁은 간격, 많은 수</text>
    <text x="270" y="274" font-size="11" text-anchor="middle" font-weight="bold">고차 중심지(대학병원): 최소요구치·도달거리 큼 → 넓은 간격, 적은 수 (저차 기능 겸비)</text>
    <text x="270" y="292" font-size="11" text-anchor="middle">원형 상권의 빈틈·중복을 없애기 위해 배후지는 정육각형 격자로 수렴</text>
  </g>
</svg>
