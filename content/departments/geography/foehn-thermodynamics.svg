    <text x="452" y="278" font-size="12" text-anchor="middle" font-weight="bold" fill="#e07a3f">기온 27°C (고온건조)</text>
    <text x="80" y="212" font-size="10" text-anchor="start">건조단열 -1.0°C/100m</text>
    <text x="105" y="145" font-size="10" text-anchor="start" font-weight="bold" fill="#2f5d50">습윤단열 -0.5°C/100m</text>
    <text x="345" y="150" font-size="11" text-anchor="start" font-weight="bold" fill="#e07a3f">전 구간 건조단열 +1.0°C/100m</text>
    <text x="270" y="308" font-size="11" text-anchor="middle" font-weight="bold">비 구름 구간(1,400m)에서 잠열 방출로 덜 식기 때문에 넘은 뒤 +7°C 상승</text>
