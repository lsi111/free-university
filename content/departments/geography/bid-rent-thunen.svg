<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="25" font-size="15" text-anchor="middle" font-weight="bold">튀넨(von Thünen)의 입찰지대 곡선과 동심원 토지이용</text>
    <line x1="65" y1="45" x2="65" y2="215" stroke="#1d1c1a" stroke-width="2"/>
    <line x1="65" y1="215" x2="495" y2="215" stroke="#1d1c1a" stroke-width="2"/>
    <text x="55" y="55" font-size="11" text-anchor="end" font-weight="bold">지대 R</text>
    <text x="55" y="72" font-size="10" text-anchor="end">(만원)</text>
    <text x="495" y="233" font-size="11" text-anchor="end" font-weight="bold">시장 거리 d (km)</text>
    <line x1="65" y1="55" x2="193" y2="215" stroke="#e07a3f" stroke-width="2.5"/>
    <line x1="65" y1="108" x2="321" y2="215" stroke="#2f5d50" stroke-width="2.5"/>
    <line x1="65" y1="148" x2="465" y2="215" stroke="#7a766d" stroke-width="2.5"/>
    <line x1="129" y1="135" x2="129" y2="215" stroke="#1d1c1a" stroke-dasharray="3,3"/>
    <line x1="225" y1="175" x2="225" y2="215" stroke="#1d1c1a" stroke-dasharray="3,3"/>
    <circle cx="129" cy="135" r="4" fill="#1d1c1a"/>
    <circle cx="225" cy="175" r="4" fill="#1d1c1a"/>
    <text x="58" y="59" font-size="11" text-anchor="end" font-weight="bold" fill="#e07a3f">120</text>
    <text x="58" y="112" font-size="11" text-anchor="end" font-weight="bold" fill="#2f5d50">80</text>
    <text x="58" y="152" font-size="11" text-anchor="end" font-weight="bold" fill="#7a766d">50</text>
    <text x="65" y="232" font-size="11" text-anchor="middle">0</text>
    <text x="129" y="232" font-size="11" text-anchor="middle" font-weight="bold">4km</text>
    <text x="225" y="232" font-size="11" text-anchor="middle" font-weight="bold">10km</text>
    <text x="465" y="232" font-size="11" text-anchor="middle" font-weight="bold">25km</text>
    <text x="110" y="75" font-size="11" text-anchor="start" font-weight="bold" fill="#e07a3f">작물 A(원예): R=120-15d</text>
    <text x="175" y="125" font-size="11" text-anchor="start" font-weight="bold" fill="#2f5d50">작물 B(임업): R=80-5d</text>
    <text x="295" y="168" font-size="11" text-anchor="start" font-weight="bold" fill="#7a766d">작물 C(곡물): R=50-2d</text>
    <rect x="65" y="245" width="64" height="34" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="97" y="267" font-size="11" text-anchor="middle" font-weight="bold">1권역: A</text>
    <rect x="129" y="245" width="96" height="34" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="177" y="267" font-size="11" text-anchor="middle" font-weight="bold">2권역: B (4~10km)</text>
    <rect x="225" y="245" width="240" height="34" rx="4" fill="#e9e1cf" stroke="#7a766d"/>
    <text x="345" y="267" font-size="11" text-anchor="middle" font-weight="bold">3권역: C (10~25km)</text>
    <text x="270" y="303" font-size="11" text-anchor="middle" font-weight="bold">각 거리에서 가장 높은 지대(입찰지대 상단 포락선)를 내는 작물이 토지를 차지함</text>
  </g>
</svg>
