<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 195" width="400" height="195">
<rect width="400" height="195" fill="#f4efe6"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a766d"/></marker></defs>
<rect x="10" y="35" width="110" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="65" y="60" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1c1a">질량 (g)</text>
<rect x="145" y="35" width="110" height="40" fill="#a9cbbf" stroke="#7a766d" stroke-width="1.5"/>
<text x="200" y="60" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1c1a">물질의 양 (mol)</text>
<rect x="280" y="35" width="110" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="335" y="60" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1c1a">입자 수 (개)</text>
<line x1="123" y1="55" x2="142" y2="55" stroke="#7a766d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="258" y1="55" x2="277" y2="55" stroke="#7a766d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="20" y="110" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">질량 → 몰: 몰질량 M으로 나눈다 (÷ M)</text>
<text x="20" y="132" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">몰 → 질량: 몰질량 M을 곱한다 (× M)</text>
<text x="20" y="154" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">몰 → 입자 수: 6.02×10²³ 을 곱한다</text>
<text x="20" y="176" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">입자 수 → 몰: 6.02×10²³ 으로 나눈다</text>

</svg>
