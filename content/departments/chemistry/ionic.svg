<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240">
<rect width="380" height="240" fill="#f4efe6"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a766d"/></marker></defs>
<text x="10" y="20" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">전자를 주고받기 전</text>
<circle cx="70" cy="70" r="26" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="70" y="75" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">Na</text>
<text x="70" y="112" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1c1a">최외각 전자 1개</text>
<circle cx="280" cy="70" r="26" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="280" y="75" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">Cl</text>
<text x="280" y="112" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1c1a">최외각 전자 7개</text>
<line x1="104" y1="70" x2="244" y2="70" stroke="#e07a3f" stroke-width="2" marker-end="url(#a)"/>
<circle cx="174" cy="70" r="5" fill="#e07a3f" stroke="#1d1c1a" stroke-width="1"/>
<text x="174" y="52" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1c1a">전자 1개 이동</text>
<line x1="190" y1="118" x2="190" y2="148" stroke="#7a766d" stroke-width="2" marker-end="url(#a)"/>
<text x="10" y="146" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">주고받은 뒤</text>
<circle cx="125" cy="195" r="20" fill="#f1c4a3" stroke="#1d1c1a" stroke-width="1.5"/>
<text x="125" y="200" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1c1a">Na<tspan dy="-5" font-size="11">+</tspan></text>
<circle cx="175" cy="195" r="30" fill="#a9cbbf" stroke="#1d1c1a" stroke-width="1.5"/>
<text x="175" y="200" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1c1a">Cl<tspan dy="-5" font-size="11">−</tspan></text>
<text x="222" y="190" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">정전기적 인력으로</text>
<text x="222" y="208" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">붙는다 (이온 결합)</text>

</svg>
