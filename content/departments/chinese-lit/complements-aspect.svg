<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">현대중국어 4대 보어 체계와 동태조사 비교</text>
    <rect x="20" y="45" width="500" height="28" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="75" y="64" font-size="11" text-anchor="middle" font-weight="bold">보어 종류</text>
    <text x="215" y="64" font-size="11" text-anchor="middle" font-weight="bold">결합 구조 (긍정 / 부정)</text>
    <text x="375" y="64" font-size="11" text-anchor="middle" font-weight="bold">예문</text>
    <text x="475" y="64" font-size="11" text-anchor="middle" font-weight="bold">핵심 기능</text>
    <rect x="20" y="73" width="500" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="75" y="95" font-size="12" text-anchor="middle" font-weight="bold">결과보어</text>
    <text x="215" y="95" font-size="11" text-anchor="middle">V + R  /  没 + V + R</text>
    <text x="375" y="95" font-size="12" text-anchor="middle" font-weight="bold">听懂 / 没听懂</text>
    <text x="475" y="95" font-size="11" text-anchor="middle">결과 도달</text>
    <rect x="20" y="107" width="500" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="75" y="129" font-size="12" text-anchor="middle" font-weight="bold">방향보어</text>
    <text x="215" y="129" font-size="11" text-anchor="middle">V + 来/去 (복합: 进来 등)</text>
    <text x="375" y="129" font-size="12" text-anchor="middle" font-weight="bold">走进来 / 走出去</text>
    <text x="475" y="129" font-size="11" text-anchor="middle">이동 방향</text>
    <rect x="20" y="141" width="500" height="34" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="75" y="163" font-size="12" text-anchor="middle" font-weight="bold">가능보어</text>
    <text x="215" y="163" font-size="11" text-anchor="middle">V + 得 + R  /  V + 不 + R</text>
    <text x="375" y="163" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">听得懂 / 听不懂</text>
    <text x="475" y="163" font-size="11" text-anchor="middle">실현 가능성</text>
    <rect x="20" y="175" width="500" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="75" y="197" font-size="12" text-anchor="middle" font-weight="bold">정도보어</text>
    <text x="215" y="197" font-size="11" text-anchor="middle">V + 得 + 정도구 / V+得+不+형</text>
    <text x="375" y="197" font-size="12" text-anchor="middle" font-weight="bold">说得很好 / 说得不好</text>
    <text x="475" y="197" font-size="11" text-anchor="middle">상태·정도 평가</text>
    <rect x="20" y="220" width="155" height="80" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="97" y="242" font-size="12" text-anchor="middle" font-weight="bold">동태조사 了 (le)</text>
    <text x="97" y="262" font-size="11" text-anchor="middle">동작의 완료·실현</text>
    <text x="97" y="282" font-size="11" text-anchor="middle" fill="#e07a3f">예: 吃了三碗饭</text>
    <rect x="192" y="220" width="155" height="80" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="270" y="242" font-size="12" text-anchor="middle" font-weight="bold">동태조사 着 (zhe)</text>
    <text x="270" y="262" font-size="11" text-anchor="middle">동작·상태의 지속</text>
    <text x="270" y="282" font-size="11" text-anchor="middle" fill="#2f5d50">예: 门开着 (열려 있다)</text>
    <rect x="365" y="220" width="155" height="80" rx="4" fill="#e9e1cf" stroke="#7a766d"/>
    <text x="442" y="242" font-size="12" text-anchor="middle" font-weight="bold">동태조사 过 (guò)</text>
    <text x="442" y="262" font-size="11" text-anchor="middle">과거의 경험 유무</text>
    <text x="442" y="282" font-size="11" text-anchor="middle">예: 去过北京 (가 봤다)</text>
  </g>
</svg>
