<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" width="400" height="196">
<rect width="400" height="196" fill="#f4efe6"/>
<rect x="16" y="12" width="368" height="38" rx="4" fill="#2f5d50" fill-opacity="0.1" stroke="#2f5d50" stroke-width="1.5"/>
<text x="28" y="37" font-size="18" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">我叫</text>
<line x1="70" y1="39" x2="130" y2="39" stroke="#1d1c1a" stroke-width="1.5"/>
<text x="134" y="37" font-size="18" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">。</text>
<text x="200" y="28" font-size="11" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">wǒ jiào + 이름</text>
<text x="200" y="43" font-size="11" text-anchor="start" font-family="sans-serif" fill="#7a766d">나는 ~라고 부른다</text>
<rect x="16" y="56" width="368" height="38" rx="4" fill="#e07a3f" fill-opacity="0.1" stroke="#e07a3f" stroke-width="1.5"/>
<text x="28" y="81" font-size="18" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">我是</text>
<line x1="70" y1="83" x2="130" y2="83" stroke="#1d1c1a" stroke-width="1.5"/>
<text x="134" y="81" font-size="18" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">人。</text>
<text x="200" y="72" font-size="11" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">wǒ shì + 나라 + rén</text>
<text x="200" y="87" font-size="11" text-anchor="start" font-family="sans-serif" fill="#7a766d">나는 ~ 사람이다</text>
<rect x="16" y="100" width="368" height="38" rx="4" fill="#2f5d50" fill-opacity="0.1" stroke="#2f5d50" stroke-width="1.5"/>
<text x="28" y="125" font-size="18" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">我有</text>
<line x1="70" y1="127" x2="130" y2="127" stroke="#1d1c1a" stroke-width="1.5"/>
<text x="134" y="125" font-size="18" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">。</text>
<text x="200" y="116" font-size="11" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">wǒ yǒu + 수 + 양사 + 명사</text>
<text x="200" y="131" font-size="11" text-anchor="start" font-family="sans-serif" fill="#7a766d">나는 ~이(가) 있다</text>
<rect x="16" y="144" width="368" height="38" rx="4" fill="#e07a3f" fill-opacity="0.1" stroke="#e07a3f" stroke-width="1.5"/>
<text x="28" y="169" font-size="18" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">我喜欢</text>
<line x1="88" y1="171" x2="148" y2="171" stroke="#1d1c1a" stroke-width="1.5"/>
<text x="152" y="169" font-size="18" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">。</text>
<text x="200" y="160" font-size="11" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">wǒ xǐhuan + 동사 + 명사</text>
<text x="200" y="175" font-size="11" text-anchor="start" font-family="sans-serif" fill="#7a766d">나는 ~을(를) 좋아한다</text>
</svg>
