<text x="280" y="199" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">숲 마을</text>
<rect x="30" y="176" width="100" height="36" rx="6" fill="#fffaf0" stroke="#2f5d50" stroke-width="2"/>
<text x="80" y="199" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">언덕 마을</text>
