<text x="98" y="112" font-family="sans-serif" font-size="12" text-anchor="end" fill="#1d1c1a">엮은 바구니</text>
<text x="180" y="244" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">받은 마을은 언젠가 답례를 한다</text>
