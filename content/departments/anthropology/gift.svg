<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
<rect width="360" height="260" fill="#f4efe6"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a766d"/></marker></defs>
<text x="180" y="16" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a" font-weight="bold">세 마을의 선물 고리</text>
<rect x="130" y="26" width="100" height="36" rx="6" fill="#fffaf0" stroke="#2f5d50" stroke-width="2"/>
<text x="180" y="49" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">물가 마을</text>
