<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 206" width="380" height="206">
<rect width="380" height="206" fill="#f4efe6"/>
<g font-family="sans-serif">
<text x="190" y="26" text-anchor="middle" font-size="13" fill="#1d1c1a" font-weight="bold">지원 장면의 연속선 (일반학급 중심에서 오른쪽으로)</text>
<rect x="8" y="56" width="68" height="64" fill="#2f5d50" stroke="#2f5d50" stroke-width="2"/>
<text x="42.0" y="92.0" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">일반학급</text>
<polygon points="76,82 76,92 82,87" fill="#e07a3f"/>
<rect x="82" y="56" width="68" height="64" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
<text x="116.0" y="83.0" text-anchor="middle" font-size="12" fill="#1d1c1a" font-weight="bold">일반학급</text>
<text x="116.0" y="101.0" text-anchor="middle" font-size="12" fill="#1d1c1a">추가 지원</text>
<polygon points="150,82 150,92 156,87" fill="#e07a3f"/>
<rect x="156" y="56" width="68" height="64" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
<text x="190.0" y="83.0" text-anchor="middle" font-size="12" fill="#1d1c1a" font-weight="bold">일부 시간</text>
<text x="190.0" y="101.0" text-anchor="middle" font-size="12" fill="#1d1c1a">특수학급</text>
<polygon points="224,82 224,92 230,87" fill="#e07a3f"/>
<rect x="230" y="56" width="68" height="64" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
<text x="264.0" y="83.0" text-anchor="middle" font-size="12" fill="#1d1c1a" font-weight="bold">특수학급</text>
<text x="264.0" y="101.0" text-anchor="middle" font-size="12" fill="#1d1c1a">중심</text>
<polygon points="298,82 298,92 304,87" fill="#e07a3f"/>
<rect x="304" y="56" width="68" height="64" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
<text x="338.0" y="92.0" text-anchor="middle" font-size="12" fill="#1d1c1a" font-weight="bold">특수학교</text>
<text x="190" y="150" text-anchor="middle" font-size="11" fill="#7a766d">칸의 이름은 지역마다 다를 수 있다</text>
<text x="190" y="172" text-anchor="middle" font-size="11" fill="#7a766d">어느 칸이 낫다는 뜻이 아니라</text>
<text x="190" y="190" text-anchor="middle" font-size="11" fill="#7a766d">학생에게 맞는 지원의 모양이 다르다는 뜻이다</text>
</g>
</svg>
