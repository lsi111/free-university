<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" width="380" height="190">
<rect width="380" height="190" fill="#f4efe6"/>
<rect x="10" y="20" width="110" height="64" rx="6" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/><text x="65" y="46" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1c1a">농부(밀)</text><text x="65" y="70" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1c1a">매출 30</text><text x="65" y="112" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f5d50">부가가치 30</text><rect x="135" y="20" width="110" height="64" rx="6" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/><text x="190" y="46" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1c1a">제분소(밀가루)</text><text x="190" y="70" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1c1a">매출 50</text><text x="190" y="112" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f5d50">부가가치 20</text><rect x="260" y="20" width="110" height="64" rx="6" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/><text x="315" y="46" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1c1a">빵집(빵)</text><text x="315" y="70" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1c1a">매출 80</text><text x="315" y="112" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f5d50">부가가치 30</text><polygon points="120,46 131,52 120,58" fill="#e07a3f"/><polygon points="245,46 256,52 245,58" fill="#e07a3f"/><line x1="10" y1="130" x2="370" y2="130" stroke="#7a766d" stroke-width="1" stroke-dasharray="4 3"/><text x="190" y="154" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1c1a">최종재 빵 80 = 부가가치의 합 30 + 20 + 30</text><text x="190" y="178" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#7a766d">단위: 만 원 (가상의 마을)</text>
</svg>
