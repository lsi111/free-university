<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="14" text-anchor="middle" font-weight="bold">IS-LM 모형: 확장적 재정정책의 승수효과와 구축효과</text>
    <line x1="60" y1="45" x2="60" y2="260" stroke="#1d1c1a" stroke-width="2"/>
    <line x1="60" y1="260" x2="340" y2="260" stroke="#1d1c1a" stroke-width="2"/>
    <text x="40" y="55" font-size="11" text-anchor="middle" font-weight="bold">이자율 r</text>
    <text x="330" y="280" font-size="11" text-anchor="middle" font-weight="bold">국민소득 Y</text>
    <line x1="80" y1="75" x2="250" y2="245" stroke="#2f5d50" stroke-width="2.2"/>
    <text x="255" y="248" font-size="11" text-anchor="start" font-weight="bold" fill="#2f5d50">IS1</text>
    <line x1="140" y1="75" x2="310" y2="245" stroke="#2f5d50" stroke-width="2.2" stroke-dasharray="6,4"/>
    <text x="315" y="248" font-size="11" text-anchor="start" font-weight="bold" fill="#2f5d50">IS2</text>
    <line x1="80" y1="235" x2="290" y2="65" stroke="#e07a3f" stroke-width="2.2"/>
    <text x="295" y="68" font-size="11" text-anchor="start" font-weight="bold" fill="#e07a3f">LM</text>
    <line x1="60" y1="160" x2="225" y2="160" stroke="#7a766d" stroke-dasharray="3,3"/>
    <line x1="60" y1="133" x2="198" y2="133" stroke="#7a766d" stroke-dasharray="3,3"/>
    <line x1="165" y1="160" x2="165" y2="260" stroke="#7a766d" stroke-dasharray="3,3"/>
    <line x1="198" y1="133" x2="198" y2="260" stroke="#2f5d50" stroke-dasharray="3,3"/>
    <line x1="225" y1="160" x2="225" y2="260" stroke="#e07a3f" stroke-dasharray="3,3"/>
    <circle cx="165" cy="160" r="4.5" fill="#1d1c1a"/>
    <text x="158" y="152" font-size="11" text-anchor="end" font-weight="bold">E1</text>
    <circle cx="198" cy="133" r="4.5" fill="#2f5d50"/>
    <text x="198" y="122" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">E2</text>
    <circle cx="225" cy="160" r="4" fill="#e07a3f"/>
    <text x="232" y="156" font-size="11" text-anchor="start" font-weight="bold" fill="#e07a3f">E'</text>
    <text x="52" y="164" font-size="11" text-anchor="end" font-weight="bold">4%</text>
    <text x="52" y="137" font-size="11" text-anchor="end" font-weight="bold" fill="#2f5d50">6%</text>
    <text x="165" y="276" font-size="11" text-anchor="middle" font-weight="bold">500</text>
    <text x="198" y="276" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">560</text>
    <text x="232" y="276" font-size="11" text-anchor="middle" font-weight="bold" fill="#e07a3f">600</text>
    <rect x="350" y="50" width="170" height="195" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="435" y="72" font-size="12" text-anchor="middle" font-weight="bold">재정팽창 효과 분해</text>
    <text x="360" y="96" font-size="11" text-anchor="start">• 초기 균형 E1: Y=500, r=4%</text>
    <text x="360" y="118" font-size="11" text-anchor="start" fill="#e07a3f">• 금리 불변 시 E': Y=600</text>
    <text x="360" y="138" font-size="10" text-anchor="start" fill="#e07a3f">  (단순 승수효과 +100)</text>
    <text x="360" y="160" font-size="11" text-anchor="start" font-weight="bold" fill="#2f5d50">• 실제 균형 E2: Y=560, r=6%</text>
    <text x="360" y="180" font-size="10" text-anchor="start" font-weight="bold" fill="#2f5d50">  (순 소득 증가 +60)</text>
    <text x="360" y="205" font-size="11" text-anchor="start" font-weight="bold" fill="#b3261e">• 구축효과(E'→E2): -40</text>
    <text x="360" y="225" font-size="10" text-anchor="start" fill="#b3261e">  (금리 상승으로 투자 감소)</text>
    <text x="270" y="304" font-size="11" text-anchor="middle" font-weight="bold">단순 승수 증가분(+100) 중 금리 상승(4%→6%)에 따른 구축효과(-40)로 실제 소득은 +60 증가</text>
  </g>
</svg>
