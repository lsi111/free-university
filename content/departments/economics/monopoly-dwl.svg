<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="14" text-anchor="middle" font-weight="bold">독점 기업의 이윤극대화(MR=MC)와 사중손실(DWL)</text>
    <line x1="60" y1="45" x2="60" y2="260" stroke="#1d1c1a" stroke-width="2"/>
    <line x1="60" y1="260" x2="340" y2="260" stroke="#1d1c1a" stroke-width="2"/>
    <text x="42" y="55" font-size="11" text-anchor="middle" font-weight="bold">가격 P</text>
    <text x="335" y="280" font-size="11" text-anchor="middle" font-weight="bold">수량 Q</text>
    <polygon points="160,140 160,220 260,220" fill="#fbe6e1" stroke="#e07a3f" stroke-width="1.5"/>
    <text x="195" y="198" font-size="11" text-anchor="middle" font-weight="bold" fill="#b3261e">사중손실</text>
    <text x="195" y="213" font-size="10" text-anchor="middle" font-weight="bold" fill="#b3261e">(DWL=400)</text>
    <rect x="60" y="140" width="100" height="80" fill="#e3efe9" fill-opacity="0.6" stroke="none"/>
    <text x="110" y="185" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">독점이윤 800</text>
    <line x1="60" y1="60" x2="310" y2="260" stroke="#2f5d50" stroke-width="2.2"/>
    <text x="300" y="245" font-size="11" text-anchor="start" font-weight="bold" fill="#2f5d50">수요 D</text>
    <line x1="60" y1="60" x2="185" y2="260" stroke="#7a766d" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="188" y="252" font-size="11" text-anchor="start" font-weight="bold" fill="#7a766d">MR</text>
    <line x1="60" y1="220" x2="320" y2="220" stroke="#e07a3f" stroke-width="2.2"/>
    <text x="322" y="224" font-size="11" text-anchor="start" font-weight="bold" fill="#e07a3f">MC=20</text>
    <line x1="60" y1="140" x2="160" y2="140" stroke="#1d1c1a" stroke-dasharray="3,3"/>
    <line x1="160" y1="140" x2="160" y2="260" stroke="#1d1c1a" stroke-dasharray="3,3"/>
    <line x1="260" y1="220" x2="260" y2="260" stroke="#1d1c1a" stroke-dasharray="3,3"/>
    <circle cx="160" cy="140" r="4.5" fill="#1d1c1a"/>
    <text x="168" y="135" font-size="11" text-anchor="start" font-weight="bold">독점(Qm=20, Pm=60)</text>
    <circle cx="160" cy="220" r="4" fill="#e07a3f"/>
    <circle cx="260" cy="220" r="4.5" fill="#2f5d50"/>
    <text x="260" y="208" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">경쟁(Qc=40, Pc=20)</text>
    <text x="52" y="64" font-size="11" text-anchor="end">100</text>
    <text x="52" y="144" font-size="11" text-anchor="end" font-weight="bold">60</text>
    <text x="52" y="224" font-size="11" text-anchor="end" font-weight="bold">20</text>
    <text x="160" y="276" font-size="11" text-anchor="middle" font-weight="bold">20</text>
    <text x="260" y="276" font-size="11" text-anchor="middle" font-weight="bold">40</text>
    <rect x="355" y="50" width="165" height="145" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="437" y="72" font-size="12" text-anchor="middle" font-weight="bold">독점 vs 완전경쟁</text>
    <text x="365" y="95" font-size="11" text-anchor="start">• 수요: P = 100 - 2Q</text>
    <text x="365" y="115" font-size="11" text-anchor="start">• 한계수입: MR = 100 - 4Q</text>
    <text x="365" y="135" font-size="11" text-anchor="start" font-weight="bold">• 독점: Qm=20, Pm=60</text>
    <text x="365" y="155" font-size="11" text-anchor="start" font-weight="bold" fill="#2f5d50">• 경쟁: Qc=40, Pc=20</text>
    <text x="365" y="175" font-size="10" text-anchor="start" font-weight="bold" fill="#b3261e">• DWL = ½×(60-20)×20 = 400</text>
    <text x="270" y="304" font-size="11" text-anchor="middle" font-weight="bold">독점은 경쟁보다 산출량을 줄이고(40→20) 가격을 높여(20→60) 사중손실 400을 낳는다</text>
  </g>
</svg>
