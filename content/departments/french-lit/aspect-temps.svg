<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="14" text-anchor="middle" font-weight="bold">프랑스어 과거 시제의 상적 대립 (Passé composé vs Imparfait)</text>
    <rect x="20" y="44" width="500" height="96" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="35" y="66" font-size="11" text-anchor="start" font-weight="bold" fill="#7a766d">시간축 (Ligne du temps)</text>
    <line x1="40" y1="105" x2="500" y2="105" stroke="#7a766d" stroke-width="2"/>
    <rect x="150" y="74" width="210" height="22" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="255" y="89" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">반과거 (Imparfait): 지속 배경 · 상태 (Il pleuvait)</text>
    <circle cx="95" cy="105" r="7" fill="#7a766d"/>
    <text x="95" y="128" font-size="10" text-anchor="middle" font-weight="bold">대과거 (Plus-que-parfait)</text>
    <circle cx="255" cy="105" r="8" fill="#e07a3f"/>
    <text x="255" y="128" font-size="10" text-anchor="middle" font-weight="bold" fill="#e07a3f">복합과거 (Passé composé): 완결 사건 (Il est sorti)</text>
    <circle cx="445" cy="105" r="7" fill="#2f5d50"/>
    <text x="445" y="128" font-size="10" text-anchor="middle" font-weight="bold" fill="#2f5d50">발화 현재 (Présent)</text>
    <rect x="20" y="150" width="80" height="28" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="60" y="169" font-size="11" text-anchor="middle" font-weight="bold">구분</text>
    <rect x="105" y="150" width="135" height="28" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="172" y="169" font-size="11" text-anchor="middle" font-weight="bold">복합과거 (Passé composé)</text>
    <rect x="245" y="150" width="135" height="28" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="312" y="169" font-size="11" text-anchor="middle" font-weight="bold">반과거 (Imparfait)</text>
    <rect x="385" y="150" width="135" height="28" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="452" y="169" font-size="11" text-anchor="middle" font-weight="bold">대과거 (Plus-que-parfait)</text>
    <rect x="20" y="182" width="80" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="203" font-size="10" text-anchor="middle" font-weight="bold">형태</text>
    <rect x="105" y="182" width="135" height="34" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="172" y="203" font-size="10" text-anchor="middle">avoir/être 현재 + p.p.</text>
    <rect x="245" y="182" width="135" height="34" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="312" y="203" font-size="10" text-anchor="middle">1인칭 복수 어간 + -ais...</text>
    <rect x="385" y="182" width="135" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="452" y="203" font-size="10" text-anchor="middle">avoir/être 반과거 + p.p.</text>
    <rect x="20" y="220" width="80" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="241" font-size="10" text-anchor="middle" font-weight="bold">상적 자질</text>
    <rect x="105" y="220" width="135" height="34" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="172" y="241" font-size="10" text-anchor="middle">완결상 · 점적 사건 · 전경</text>
    <rect x="245" y="220" width="135" height="34" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="312" y="241" font-size="10" text-anchor="middle">미완결상 · 지속 · 습관 · 배경</text>
    <rect x="385" y="220" width="135" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="452" y="241" font-size="10" text-anchor="middle">과거 사건보다 앞선 대과거</text>
    <rect x="20" y="258" width="80" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="279" font-size="10" text-anchor="middle" font-weight="bold">서사 역할</text>
    <rect x="105" y="258" width="135" height="34" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="172" y="279" font-size="10" text-anchor="middle">사건의 진행과 변화推動</text>
    <rect x="245" y="258" width="135" height="34" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="312" y="279" font-size="10" text-anchor="middle">상황 묘사 · 심리 · 배경 설정</text>
    <rect x="385" y="258" width="135" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="452" y="279" font-size="10" text-anchor="middle">선행 원인 · 회상 제시</text>
  </g>
</svg>
