<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="14" text-anchor="middle" font-weight="bold">20세기 프랑스 서사의 세 봉우리: 프루스트 · 실존주의 · 누보로망</text>
    <rect x="20" y="45" width="80" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="60" y="65" font-size="11" text-anchor="middle" font-weight="bold">구분</text>
    <rect x="105" y="45" width="140" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="175" y="65" font-size="11" text-anchor="middle" font-weight="bold">프루스트 (내면과 시간)</text>
    <rect x="250" y="45" width="140" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="320" y="65" font-size="11" text-anchor="middle" font-weight="bold">실존주의 (사르트르·카뮈)</text>
    <rect x="395" y="45" width="125" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="457" y="65" font-size="11" text-anchor="middle" font-weight="bold">누보로망 (1950~60년대)</text>
    <rect x="20" y="78" width="80" height="38" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="101" font-size="10" text-anchor="middle" font-weight="bold">핵심 문제</text>
    <rect x="105" y="78" width="140" height="38" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="175" y="101" font-size="10" text-anchor="middle">잃어버린 시간과 기억의 복원</text>
    <rect x="250" y="78" width="140" height="38" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="320" y="101" font-size="10" text-anchor="middle">부조리 · 자유 · 역사적 책임</text>
    <rect x="395" y="78" width="125" height="38" rx="4" fill="#fbe6e1" stroke="#7a766d"/>
    <text x="457" y="101" font-size="10" text-anchor="middle">전통 소설 규범(인물·줄거리) 해체</text>
    <rect x="20" y="120" width="80" height="38" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="143" font-size="10" text-anchor="middle" font-weight="bold">핵심 개념</text>
    <rect x="105" y="120" width="140" height="38" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="175" y="143" font-size="10" text-anchor="middle">무의지적 기억(마들렌 에피소드)</text>
    <rect x="250" y="120" width="140" height="38" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="320" y="143" font-size="10" text-anchor="middle">실존이 본질에 앞선다 · 앙가주망</text>
    <rect x="395" y="120" width="125" height="38" rx="4" fill="#fbe6e1" stroke="#7a766d"/>
    <text x="457" y="143" font-size="10" text-anchor="middle">불신의 시대에의 소설 · 사물 묘사</text>
    <rect x="20" y="162" width="80" height="38" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="185" font-size="10" text-anchor="middle" font-weight="bold">서사 기법</text>
    <rect x="105" y="162" width="140" height="38" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="175" y="185" font-size="10" text-anchor="middle">긴 호흡의 내면 의식 흐름</text>
    <rect x="250" y="162" width="140" height="38" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="320" y="185" font-size="10" text-anchor="middle">철학적 독백 · 건조한 영도 문체</text>
    <rect x="395" y="162" width="125" height="38" rx="4" fill="#fbe6e1" stroke="#7a766d"/>
    <text x="457" y="185" font-size="10" text-anchor="middle">심리 배제 · 기하학적 시선 · 하위대화</text>
    <rect x="20" y="204" width="80" height="38" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="60" y="227" font-size="10" text-anchor="middle" font-weight="bold">대표 작품</text>
    <rect x="105" y="204" width="140" height="38" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="175" y="227" font-size="10" text-anchor="middle">《잃어버린 시간을 찾아서》</text>
    <rect x="250" y="204" width="140" height="38" rx="4" fill="#fdf0d5" stroke="#7a766d"/>
    <text x="320" y="227" font-size="10" text-anchor="middle">《구토》 · 《이방인》 · 《페스트》</text>
    <rect x="395" y="204" width="125" height="38" rx="4" fill="#fbe6e1" stroke="#7a766d"/>
    <text x="457" y="227" font-size="10" text-anchor="middle">《질투》(로브그리예) · 《향성》(사로트)</text>
    <rect x="20" y="254" width="500" height="50" rx="4" fill="#f4e9d6" stroke="#7a766d"/>
    <text x="270" y="274" font-size="11" text-anchor="middle" font-weight="bold">20세기 소설의 궤적: 발자크식 전지적 서술자 해체 → 주관적 시간(프루스트) → 역사 참여(실존주의)</text>
    <text x="270" y="294" font-size="11" text-anchor="middle">→ 인물과 줄거리라는 소설의 뼈대 자체를 실험적으로 질문함(누보로망)</text>
  </g>
</svg>
