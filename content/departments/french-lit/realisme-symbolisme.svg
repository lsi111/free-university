<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="14" text-anchor="middle" font-weight="bold">19세기 프랑스 문학: 사실주의 · 자연주의 · 상징주의 시학</text>
    <rect x="20" y="50" width="150" height="175" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="95" y="74" font-size="12" text-anchor="middle" font-weight="bold">사실주의 (Réalisme)</text>
    <text x="30" y="102" font-size="10" text-anchor="start">전성기: 1830~1860년대</text>
    <text x="30" y="125" font-size="10" text-anchor="start">핵심: 당대 자본주의 사회 관찰</text>
    <text x="30" y="148" font-size="10" text-anchor="start">기법: 인물 재등장 · 자유간접화법</text>
    <text x="30" y="171" font-size="10" text-anchor="start">미학: 비개입적 객관성(Impassibilité)</text>
    <text x="30" y="194" font-size="10" text-anchor="start">작가: 스탕달 · 발자크 · 플로베르</text>
    <rect x="195" y="50" width="150" height="175" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="270" y="74" font-size="12" text-anchor="middle" font-weight="bold">자연주의 (Naturalisme)</text>
    <text x="205" y="102" font-size="10" text-anchor="start">전성기: 1860~1890년대</text>
    <text x="205" y="125" font-size="10" text-anchor="start">핵심: 유전과 환경의 과학적 실험</text>
    <text x="205" y="148" font-size="10" text-anchor="start">기법: 실험소설론(Roman expérimental)</text>
    <text x="205" y="171" font-size="10" text-anchor="start">소재: 광산 노동자 · 도시 하층민</text>
    <text x="205" y="194" font-size="10" text-anchor="start">작가: 에밀 졸라 · 모파상</text>
    <rect x="370" y="50" width="150" height="175" rx="4" fill="#fbe6e1" stroke="#b3261e"/>
    <text x="445" y="74" font-size="12" text-anchor="middle" font-weight="bold">상징주의 (Symbolisme)</text>
    <text x="380" y="102" font-size="10" text-anchor="start">전성기: 1857년(악의 꽃)~세기말</text>
    <text x="380" y="125" font-size="10" text-anchor="start">핵심: 감각의 교감(Correspondances)</text>
    <text x="380" y="148" font-size="10" text-anchor="start">기법: 암시 · 음악성 · 투시자 시학</text>
    <text x="380" y="171" font-size="10" text-anchor="start">주제: 우울(Spleen)과 이상(Idéal)</text>
    <text x="380" y="194" font-size="10" text-anchor="start">시인: 보들레르 · 베를렌 · 랭보 · 말라르메</text>
    <rect x="20" y="240" width="500" height="62" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="270" y="262" font-size="11" text-anchor="middle" font-weight="bold">19세기 후반의 이중 혁명: 산문에서는 플로베르와 졸라가 정밀한 객관 묘사와 과학적 실증을 완성했고,</text>
    <text x="270" y="284" font-size="11" text-anchor="middle">시에서는 보들레르 이후 상징주의가 직접적 설명 대신 암시와 감각의 조응으로 현대시의 문을 열었다.</text>
  </g>
</svg>
