<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#f4efe6"/>
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">질문의 세 단계</text>
  <g font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">
    <rect x="20" y="150" width="110" height="70" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
    <text x="75" y="178" font-weight="bold">1단계</text><text x="75" y="198">사실 확인</text>
    <rect x="145" y="110" width="110" height="110" fill="#e07a3f" fill-opacity="0.35" stroke="#e07a3f" stroke-width="2"/>
    <text x="200" y="138" font-weight="bold">2단계</text><text x="200" y="158">이유 설명</text>
    <rect x="270" y="70" width="110" height="150" fill="#2f5d50"/>
    <text x="325" y="98" fill="#ffffff" font-weight="bold">3단계</text><text x="325" y="118" fill="#ffffff">새 상황 적용</text>
  </g>
  <text x="200" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a766d">오른쪽으로 갈수록 학생의 생각이 더 많이 드러난다</text>
</svg>
