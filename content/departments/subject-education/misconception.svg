<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290">
  <rect width="400" height="290" fill="#f4efe6"/>
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">오개념을 다루는 네 걸음 (가상 예)</text>
  <g font-family="sans-serif" font-size="12" fill="#1d1c1a">
    <rect x="20" y="40" width="150" height="44" fill="#2f5d50"/>
    <text x="32" y="67" fill="#ffffff" font-weight="bold">1 생각 드러내기</text>
    <text x="190" y="67">곱하면 늘 커진다고 예상한다</text>
    <rect x="20" y="100" width="150" height="44" fill="#e07a3f"/>
    <text x="32" y="127" font-weight="bold">2 어긋나는 사례</text>
    <text x="190" y="127">4 × 0.5 = 2 로 줄어든다</text>
    <rect x="20" y="160" width="150" height="44" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
    <text x="32" y="187" font-weight="bold">3 새 설명 잇기</text>
    <text x="190" y="187">0.5배는 절반을 뜻한다</text>
    <rect x="20" y="220" width="150" height="44" fill="#ffffff" stroke="#7a766d" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="32" y="247" font-weight="bold">4 다시 확인하기</text>
    <text x="190" y="247">비슷한 새 문제로 점검한다</text>
  </g>
  <g fill="#1d1c1a" stroke="#1d1c1a" stroke-width="2">
    <line x1="95" y1="85" x2="95" y2="92"/><polygon points="95,99 90,92 100,92"/>
    <line x1="95" y1="145" x2="95" y2="152"/><polygon points="95,159 90,152 100,152"/>
    <line x1="95" y1="205" x2="95" y2="212"/><polygon points="95,219 90,212 100,212"/>
  </g>
</svg>
