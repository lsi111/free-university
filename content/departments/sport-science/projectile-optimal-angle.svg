<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#fcfaf8" rx="8"/>
  <text x="270" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">투사체 방출 높이(h₀)에 따른 비거리와 최적 방출 각도</text>
  
  <!-- Ground -->
  <line x1="50" y1="260" x2="500" y2="260" stroke="#475569" stroke-width="2"/>
  <rect x="50" y="260" width="450" height="15" fill="#e2e8f0"/>
  
  <!-- Athlete / Release Height -->
  <rect x="65" y="170" width="16" height="90" fill="#64748b" rx="2"/>
  <circle cx="73" cy="160" r="10" fill="#64748b"/>
  <circle cx="85" cy="155" r="6" fill="#f59e0b"/>
  <line x1="85" y1="155" x2="85" y2="260" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="92" y="210" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">방출 높이 h₀ (약 2m)</text>
  
  <!-- Trajectory 1: 45 degrees (suboptimal when h > 0) -->
  <path d="M 85 155 Q 230 10, 420 260" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="420" cy="260" r="4" fill="#94a3b8"/>
  <text x="420" y="278" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">45° (비거리 약 19.8m)</text>
  
  <!-- Trajectory 2: Optimal ~38-42 degrees -->
  <path d="M 85 155 Q 260 45, 465 260" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <circle cx="465" cy="260" r="5" fill="#2563eb"/>
  <text x="465" y="278" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">최적각 40° (비거리 20.6m)</text>
  
  <!-- Trajectory 3: 30 degrees (too flat) -->
  <path d="M 85 155 Q 250 110, 390 260" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="370" y="278" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">30° (18.2m)</text>
  
  <!-- Principle callout box -->
  <rect x="230" y="60" width="260" height="90" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="82" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">방출 높이와 최적 투사 각도</text>
  <text x="245" y="104" font-family="sans-serif" font-size="11" fill="#1e3a8a">• 지면과 동일 높이(h₀=0): 최적각 45°</text>
  <text x="245" y="122" font-family="sans-serif" font-size="11" fill="#1e3a8a">• 방출 높이가 높을수록(h₀>0): 최적각 &lt; 45°</text>
  <text x="245" y="140" font-family="sans-serif" font-size="11" fill="#1e3a8a">• 포환/창던지기 실전 최적각: 37°~42°</text>
</svg>