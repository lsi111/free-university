<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#fdfbf7" rx="8"/>
  <text x="270" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">운동 강도에 따른 혈중 젖산 농도 곡선 및 젖산역치(LT/OBLA)</text>
  
  <!-- Axes -->
  <line x1="70" y1="260" x2="490" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="70" y1="260" x2="70" y2="50" stroke="#64748b" stroke-width="2"/>
  
  <!-- Y axis labels -->
  <text x="60" y="264" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">0</text>
  <text x="60" y="215" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">2 (LT)</text>
  <text x="60" y="165" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">4 (OBLA)</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">8</text>
  <text x="60" y="55" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">12 (mmol/L)</text>
  
  <!-- X axis labels -->
  <text x="70" y="280" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">안정시</text>
  <text x="170" y="280" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">50%</text>
  <text x="260" y="280" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">70% (LT)</text>
  <text x="360" y="280" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">85% (OBLA)</text>
  <text x="460" y="280" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">100% VO₂max</text>
  
  <!-- Grid lines -->
  <line x1="70" y1="215" x2="490" y2="215" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <line x1="70" y1="165" x2="490" y2="165" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  
  <!-- Curve -->
  <!-- Starts near 1.0 mmol at rest (y=235), stays flat to 260px (y=215), bends sharply up to 360px (y=165), then steep to 460px (y=70) -->
  <path d="M 70 240 Q 180 238 260 215 T 360 165 Q 410 110 460 70" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  
  <!-- Critical points -->
  <!-- LT Point -->
  <circle cx="260" cy="215" r="5" fill="#dc2626"/>
  <line x1="260" y1="215" x2="260" y2="260" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="200" y="180" width="110" height="28" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="255" y="198" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">젖산역치 (LT, ~2mM)</text>
  
  <!-- OBLA Point -->
  <circle cx="360" cy="165" r="5" fill="#b91c1c"/>
  <line x1="360" y1="165" x2="360" y2="260" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="310" y="125" width="130" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="375" y="143" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">젖산축적시작점 (OBLA, 4mM)</text>
  
  <!-- Zone annotations -->
  <rect x="90" y="90" width="110" height="50" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="145" y="110" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">유산소성 에너지</text>
  <text x="145" y="128" font-family="sans-serif" font-size="10" fill="#15803d" text-anchor="middle">젖산 생성 = 제거 평형</text>
  
  <rect x="420" y="190" width="105" height="50" rx="4" fill="#fef2f2" stroke="#f87171"/>
  <text x="472" y="210" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">무산소성 해당계 급증</text>
  <text x="472" y="228" font-family="sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">혈중 산성화·피로 누적</text>
</svg>