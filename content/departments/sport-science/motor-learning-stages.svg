<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#fafaf9" rx="8"/>
  <text x="270" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c1917" text-anchor="middle">Fitts &amp; Posner 운동학습 3단계와 제어 특성 변화</text>
  
  <!-- 3 Stages Columns -->
  <!-- Stage 1 -->
  <rect x="40" y="55" width="140" height="180" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="40" y="55" width="140" height="32" rx="6" fill="#ef4444"/>
  <text x="110" y="76" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1단계: 인지 단계</text>
  <text x="110" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">"무엇을 할 것인가?"</text>
  <text x="50" y="130" font-family="sans-serif" font-size="10" fill="#7f1d1d">• 의식적 주의 집중 극대</text>
  <text x="50" y="150" font-family="sans-serif" font-size="10" fill="#7f1d1d">• 수행 오류 잦고 편차 큼</text>
  <text x="50" y="170" font-family="sans-serif" font-size="10" fill="#7f1d1d">• 시각·언어 지시 의존</text>
  <text x="50" y="195" font-family="sans-serif" font-size="10" fill="#7f1d1d">• 잦은 외부 피드백(KR/KP)</text>
  <text x="50" y="215" font-family="sans-serif" font-size="10" fill="#7f1d1d">• 경직된 분절 움직임</text>

  <!-- Stage 2 -->
  <rect x="200" y="55" width="140" height="180" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <rect x="200" y="55" width="140" height="32" rx="6" fill="#eab308"/>
  <text x="270" y="76" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2단계: 연합 단계</text>
  <text x="270" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#854d0e" text-anchor="middle">"어떻게 조화시킬 것인가?"</text>
  <text x="210" y="130" font-family="sans-serif" font-size="10" fill="#713f12">• 동작 간 협응 패턴 형성</text>
  <text x="210" y="150" font-family="sans-serif" font-size="10" fill="#713f12">• 오류 빈도와 크기 감소</text>
  <text x="210" y="170" font-family="sans-serif" font-size="10" fill="#713f12">• 고유수용성 감각 활용</text>
  <text x="210" y="195" font-family="sans-serif" font-size="10" fill="#713f12">• 점진적 피드백 감소</text>
  <text x="210" y="215" font-family="sans-serif" font-size="10" fill="#713f12">• 가변적 무선연습 효과</text>

  <!-- Stage 3 -->
  <rect x="360" y="55" width="140" height="180" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="360" y="55" width="140" height="32" rx="6" fill="#22c55e"/>
  <text x="430" y="76" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3단계: 자동화 단계</text>
  <text x="430" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">"자율적 실행과 전략"</text>
  <text x="370" y="130" font-family="sans-serif" font-size="10" fill="#14532d">• 동작의 완전 자동화</text>
  <text x="370" y="150" font-family="sans-serif" font-size="10" fill="#14532d">• 일관되고 안정된 수행</text>
  <text x="370" y="170" font-family="sans-serif" font-size="10" fill="#14532d">• 외부 전술·환경에 주의</text>
  <text x="370" y="195" font-family="sans-serif" font-size="10" fill="#14532d">• 스스로 오류 감지·수정</text>
  <text x="370" y="215" font-family="sans-serif" font-size="10" fill="#14532d">• 실전 경기 스트레스 극복</text>

  <!-- Progress Arrow -->
  <line x1="50" y1="260" x2="480" y2="260" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="495,260 480,253 480,267" fill="#0284c7"/>
  <text x="270" y="285" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">연습의 누적에 따른 학습 진행 방향 →</text>
  <text x="60" y="305" font-family="sans-serif" font-size="10" fill="#64748b">주의 요구량: 높음 → 낮음</text>
  <text x="470" y="305" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">오류 수정: 외부 의존 → 자율 교정</text>
</svg>