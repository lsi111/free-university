<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f8fafc" rx="8"/>
  <text x="270" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">착지 시 수직 지면반력(vGRF) 시간-힘 곡선 및 충격량</text>
  
  <!-- Axes -->
  <line x1="70" y1="260" x2="490" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="70" y1="260" x2="70" y2="50" stroke="#64748b" stroke-width="2"/>
  
  <text x="60" y="264" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">0 BW</text>
  <text x="60" y="215" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">1 BW (체중)</text>
  <text x="60" y="150" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">3 BW</text>
  <text x="60" y="80" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">5 BW</text>
  
  <text x="270" y="295" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">시간 (ms) →</text>
  <text x="70" y="278" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">0 (접지)</text>
  <text x="150" y="278" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">30ms</text>
  <text x="270" y="278" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">100ms</text>
  <text x="420" y="278" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">250ms</text>
  
  <!-- Body weight baseline -->
  <line x1="70" y1="215" x2="490" y2="215" stroke="#94a3b8" stroke-dasharray="4,4"/>
  <text x="480" y="210" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">정적 체중 (1 Body Weight)</text>
  
  <!-- Curve: Touchdown (70, 260) -> Sharp Impact Peak (140, 85) -> Valley (190, 170) -> Active Muscle Peak (270, 130) -> Settle to BW (420, 215) -->
  <path d="M 70 260 C 90 260, 115 110, 135 85 C 155 60, 175 160, 195 170 C 225 180, 250 120, 275 130 C 315 145, 360 215, 420 215" 
        fill="rgba(59, 130, 246, 0.15)" stroke="#2563eb" stroke-width="3"/>
        
  <!-- Peak annotations -->
  <circle cx="135" cy="85" r="5" fill="#ef4444"/>
  <rect x="90" y="45" width="130" height="32" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="155" y="60" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">제1 피크 (수동적 충격 피크)</text>
  <text x="155" y="72" font-family="sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">골격계 직접 전달 / 부상 위험</text>
  
  <circle cx="275" cy="130" r="5" fill="#10b981"/>
  <rect x="250" y="80" width="140" height="32" rx="4" fill="#d1fae5" stroke="#10b981"/>
  <text x="320" y="95" font-family="sans-serif" font-size="10" font-weight="bold" fill="#065f46" text-anchor="middle">제2 피크 (능동적 근육 수축)</text>
  <text x="320" y="107" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="middle">무릎·발목 굴곡으로 충격 흡수</text>
  
  <!-- Impulse callout -->
  <rect x="330" y="150" width="150" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="405" y="167" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">곡선 아래 면적 = 충격량</text>
  <text x="405" y="182" font-family="sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">I = ∫ F dt = Δ(mv)</text>
</svg>