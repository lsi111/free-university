<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 275" width="400" height="275">
<rect width="400" height="275" fill="#f4efe6"/>
<text x="200.0" y="24.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">추천 후보 게시물 5개의 예측값 (가상)</text>
<rect x="15.0" y="38.0" width="370.0" height="42.0" rx="2" fill="#e9e1cf" stroke="#7a766d" stroke-width="1"/>
<text x="25.0" y="63.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start" font-weight="bold">게시물</text>
<text x="250.0" y="55.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">예측 클릭</text>
<text x="250.0" y="72.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">확률(%)</text>
<text x="340.0" y="55.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">예측 체류</text>
<text x="340.0" y="72.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">시간(초)</text>
<rect x="15.0" y="80.0" width="370.0" height="30.0" rx="2" fill="#ffffff" stroke="#7a766d" stroke-width="1"/>
<text x="25.0" y="100.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">1  친구 근황</text>
<text x="250.0" y="100.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">40</text>
<text x="340.0" y="100.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">20</text>
<rect x="15.0" y="110.0" width="370.0" height="30.0" rx="2" fill="#faf6ee" stroke="#7a766d" stroke-width="1"/>
<text x="25.0" y="130.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">2  논쟁 영상</text>
<text x="250.0" y="130.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">60</text>
<text x="340.0" y="130.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">50</text>
<rect x="15.0" y="140.0" width="370.0" height="30.0" rx="2" fill="#ffffff" stroke="#7a766d" stroke-width="1"/>
<text x="25.0" y="160.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">3  지역 공지</text>
<text x="250.0" y="160.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">20</text>
<text x="340.0" y="160.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">10</text>
<rect x="15.0" y="170.0" width="370.0" height="30.0" rx="2" fill="#faf6ee" stroke="#7a766d" stroke-width="1"/>
<text x="25.0" y="190.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">4  취미 클립</text>
<text x="250.0" y="190.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">50</text>
<text x="340.0" y="190.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">30</text>
<rect x="15.0" y="200.0" width="370.0" height="30.0" rx="2" fill="#ffffff" stroke="#7a766d" stroke-width="1"/>
<text x="25.0" y="220.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">5  새 주제 기사</text>
<text x="250.0" y="220.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">30</text>
<text x="340.0" y="220.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">40</text>
<text x="200.0" y="252.0" font-family="sans-serif" font-size="12" fill="#2f5d50" text-anchor="middle" font-weight="bold">점수 = 0.5 × 클릭 확률 + 0.5 × 체류 시간</text>
<text x="200.0" y="268.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">점수가 높은 것이 피드 위쪽에 놓인다</text>
</svg>
