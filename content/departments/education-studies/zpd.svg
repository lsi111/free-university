<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#f4efe6"/>
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">근접발달영역 (비고츠키)</text>
  <circle cx="105" cy="135" r="95" fill="#ffffff" stroke="#7a766d" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="105" cy="135" r="65" fill="#e07a3f" fill-opacity="0.35" stroke="#e07a3f" stroke-width="2"/>
  <circle cx="105" cy="135" r="35" fill="#2f5d50" stroke="#2f5d50" stroke-width="2"/>
  <g stroke="#1d1c1a" stroke-width="1.5" fill="#1d1c1a">
    <line x1="170" y1="75" x2="205" y2="60"/><circle cx="170" cy="75" r="3"/>
    <line x1="160" y1="135" x2="205" y2="135"/><circle cx="160" cy="135" r="3"/>
    <line x1="105" y1="165" x2="205" y2="210"/><circle cx="105" cy="165" r="3" fill="#ffffff"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#1d1c1a">
    <text x="210" y="56">아직 도움을 받아도</text><text x="210" y="72">어려운 것</text>
    <text x="210" y="131" font-weight="bold">도움을 받으면 할 수 있는 것</text><text x="210" y="147" font-weight="bold">= 근접발달영역</text>
    <text x="210" y="214">혼자 할 수 있는 것</text>
  </g>
