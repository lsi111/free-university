<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">사회연결망: 강한 연결 클러스터와 약한 연결 다리(Bridge)</text>
    <rect x="30" y="55" width="190" height="175" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="125" y="78" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">집단 1 (강한 연결망)</text>
    <line x1="80" y1="120" x2="170" y2="120" stroke="#2f5d50" stroke-width="3"/>
    <line x1="80" y1="120" x2="125" y2="190" stroke="#2f5d50" stroke-width="3"/>
    <line x1="170" y1="120" x2="125" y2="190" stroke="#2f5d50" stroke-width="3"/>
    <rect x="320" y="55" width="190" height="175" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="415" y="78" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">집단 2 (강한 연결망)</text>
    <line x1="370" y1="120" x2="460" y2="120" stroke="#2f5d50" stroke-width="3"/>
    <line x1="370" y1="120" x2="415" y2="190" stroke="#2f5d50" stroke-width="3"/>
    <line x1="460" y1="120" x2="415" y2="190" stroke="#2f5d50" stroke-width="3"/>
    <line x1="170" y1="120" x2="370" y2="120" stroke="#e07a3f" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="270" y="108" font-size="12" text-anchor="middle" font-weight="bold" fill="#e07a3f">약한 연결 (Bridge)</text>
    <text x="270" y="145" font-size="12" text-anchor="middle" font-weight="bold" fill="#b3261e">구조적 공백</text>
    <text x="270" y="162" font-size="10" text-anchor="middle" fill="#7a766d">(집단 1·2 사이 빈틈)</text>
    <circle cx="80" cy="120" r="18" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
    <text x="80" y="125" font-size="13" text-anchor="middle" font-weight="bold">C</text>
    <circle cx="170" cy="120" r="18" fill="#fdf0d5" stroke="#e07a3f" stroke-width="2"/>
    <text x="170" y="125" font-size="13" text-anchor="middle" font-weight="bold">A</text>
    <circle cx="125" cy="190" r="18" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
    <text x="125" y="195" font-size="13" text-anchor="middle" font-weight="bold">D</text>
    <circle cx="370" cy="120" r="18" fill="#fdf0d5" stroke="#e07a3f" stroke-width="2"/>
    <text x="370" y="125" font-size="13" text-anchor="middle" font-weight="bold">B</text>
    <circle cx="460" cy="120" r="18" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
    <text x="460" y="125" font-size="13" text-anchor="middle" font-weight="bold">E</text>
    <circle cx="415" cy="190" r="18" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
    <text x="415" y="195" font-size="13" text-anchor="middle" font-weight="bold">F</text>
    <rect x="30" y="245" width="480" height="58" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="270" y="266" font-size="11" text-anchor="middle" font-weight="bold">실선(굵은 선): 강한 연결(집단 내부 중복 정보) / 점선: 약한 연결(집단 간 비중복 새 정보 전달)</text>
    <text x="270" y="286" font-size="11" text-anchor="middle">노드 A와 B는 구조적 공백을 가로질러 두 집단을 잇는 중개자(Broker) 위치를 차지함</text>
  </g>
</svg>
