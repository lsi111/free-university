<rect x="70.0" y="50" width="20.0" height="40" fill="#d9e6df" stroke="#2f5d50" stroke-width="2"/>
<text x="96.0" y="75" font-family="sans-serif" font-size="13" text-anchor="start" fill="#1d1c1a">상 10%</text>
<rect x="50.0" y="94" width="60.0" height="40" fill="#d9e6df" stroke="#2f5d50" stroke-width="2"/>
<text x="80" y="119" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">중 30%</text>
<rect x="20.0" y="138" width="120.0" height="40" fill="#d9e6df" stroke="#2f5d50" stroke-width="2"/>
<text x="80" y="163" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">하 60%</text>
<text x="270" y="30" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1d1c1a" font-weight="bold">나 사회</text>
<rect x="260.0" y="50" width="20.0" height="40" fill="#d9e6df" stroke="#2f5d50" stroke-width="2"/>
<text x="286.0" y="75" font-family="sans-serif" font-size="13" text-anchor="start" fill="#1d1c1a">상 10%</text>
<rect x="210.0" y="94" width="120.0" height="40" fill="#d9e6df" stroke="#2f5d50" stroke-width="2"/>
<text x="270" y="119" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">중 60%</text>
<rect x="240.0" y="138" width="60.0" height="40" fill="#d9e6df" stroke="#2f5d50" stroke-width="2"/>
<text x="270" y="163" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">하 30%</text>
<text x="20" y="214" font-family="sans-serif" font-size="12" text-anchor="start" fill="#1d1c1a">막대의 폭 = 그 층의 인구 비율 (가상의 두 사회)</text>
<text x="20" y="234" font-family="sans-serif" font-size="12" text-anchor="start" fill="#7a766d">상·중·하는 소득과 직업 등을 함께 본 구분</text>
</svg>
