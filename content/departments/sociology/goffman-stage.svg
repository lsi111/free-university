<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230">
<rect width="400" height="230" fill="#f4efe6"/>
<rect x="8.0" y="40.0" width="180.0" height="150.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<rect x="212.0" y="40.0" width="180.0" height="150.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="98.0" y="62.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">공간 A</text>
<text x="302.0" y="62.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">공간 B</text>
<text x="98.0" y="94.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">손님이 들어온다</text>
<text x="98.0" y="124.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">정중한 말씨, 단정한 복장</text>
<text x="98.0" y="154.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">메뉴판, 식탁</text>
<text x="302.0" y="94.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">손님은 들어오지 않는다</text>
<text x="302.0" y="124.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">농담, 투덜거림, 편한 자세</text>
<text x="302.0" y="154.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">식자재, 조리대</text>
<line x1="8.0" y1="20.0" x2="68.0" y2="20.0" stroke="#1d1c1a" stroke-width="2"/>
