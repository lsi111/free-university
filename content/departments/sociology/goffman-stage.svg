<text x="76.0" y="24.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="start">손님 출입</text>
<line x1="188.0" y1="115.0" x2="212.0" y2="115.0" stroke="#7a766d" stroke-width="2" stroke-dasharray="4 3"/>
<text x="200.0" y="210.0" font-family="sans-serif" font-size="12" fill="#7a766d" text-anchor="middle">직원은 두 공간을 오간다</text>
