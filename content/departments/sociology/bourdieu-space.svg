<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">부르디외의 사회적 공간과 아비투스 지형</text>
    <line x1="270" y1="50" x2="270" y2="270" stroke="#1d1c1a" stroke-width="2"/>
    <line x1="60" y1="160" x2="480" y2="160" stroke="#1d1c1a" stroke-width="2"/>
    <text x="270" y="44" font-size="12" text-anchor="middle" font-weight="bold">자본 총량 많음 (+)</text>
    <text x="270" y="288" font-size="12" text-anchor="middle" font-weight="bold">자본 총량 적음 (-)</text>
    <text x="55" y="145" font-size="11" text-anchor="start" font-weight="bold" fill="#2f5d50">문화자본 우위</text>
    <text x="55" y="178" font-size="10" text-anchor="start" fill="#7a766d">(경제자본 열위)</text>
    <text x="485" y="145" font-size="11" text-anchor="end" font-weight="bold" fill="#e07a3f">경제자본 우위</text>
    <text x="485" y="178" font-size="10" text-anchor="end" fill="#7a766d">(문화자본 열위)</text>
    <rect x="75" y="65" width="170" height="70" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="160" y="88" font-size="12" text-anchor="middle" font-weight="bold">영역 A: 예술가·대학교수</text>
    <text x="160" y="108" font-size="11" text-anchor="middle">높은 문화자본, 중간 경제자본</text>
    <text x="160" y="124" font-size="10" text-anchor="middle" fill="#2f5d50">전위 예술·독서 취향</text>
    <rect x="295" y="65" width="170" height="70" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="380" y="88" font-size="12" text-anchor="middle" font-weight="bold">영역 B: 대기업 경영자·상공업자</text>
    <text x="380" y="108" font-size="11" text-anchor="middle">높은 경제자본, 상대적 문화자본 열위</text>
    <text x="380" y="124" font-size="10" text-anchor="middle" fill="#e07a3f">과시적·호화 소비 취향</text>
    <rect x="75" y="185" width="170" height="70" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="160" y="208" font-size="12" text-anchor="middle" font-weight="bold">영역 C: 초중등 교사·문화 실무자</text>
    <text x="160" y="228" font-size="11" text-anchor="middle">중간 이하 총량, 문화자본 상대 우위</text>
    <text x="160" y="244" font-size="10" text-anchor="middle">정통 문화 추종(문화적 선의)</text>
    <rect x="295" y="185" width="170" height="70" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="380" y="208" font-size="12" text-anchor="middle" font-weight="bold">영역 D: 숙련·비숙련 생산직·소상인</text>
    <text x="380" y="228" font-size="11" text-anchor="middle">낮은 자본 총량, 실용적 생계 중심</text>
    <text x="380" y="244" font-size="10" text-anchor="middle">필요의 취향 (실용성 중시)</text>
    <text x="270" y="308" font-size="11" text-anchor="middle" font-weight="bold">아비투스: 각 위치의 조건이 내면화되어 구별짓기(취향)를 낳음</text>
  </g>
</svg>
