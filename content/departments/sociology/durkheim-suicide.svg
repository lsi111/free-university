<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">뒤르켐의 자살 4유형: 사회적 통합과 규제의 두 축</text>
    <line x1="270" y1="55" x2="270" y2="275" stroke="#2f5d50" stroke-width="2"/>
    <line x1="70" y1="165" x2="470" y2="165" stroke="#e07a3f" stroke-width="2"/>
    <text x="270" y="48" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">사회적 규제 과잉 (높음)</text>
    <text x="270" y="295" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">사회적 규제 부족 (낮음)</text>
    <text x="62" y="160" font-size="11" text-anchor="end" font-weight="bold" fill="#e07a3f">사회적 통합 부족</text>
    <text x="62" y="176" font-size="11" text-anchor="end" font-weight="bold" fill="#e07a3f">(낮음)</text>
    <text x="478" y="160" font-size="11" text-anchor="start" font-weight="bold" fill="#e07a3f">사회적 통합 과잉</text>
    <text x="478" y="176" font-size="11" text-anchor="start" font-weight="bold" fill="#e07a3f">(높음)</text>
    <rect x="80" y="130" width="160" height="70" rx="4" fill="#ffffff" stroke="#e07a3f"/>
    <text x="160" y="154" font-size="13" text-anchor="middle" font-weight="bold">이기적 자살</text>
    <text x="160" y="174" font-size="11" text-anchor="middle">소속감·유대 약화</text>
    <text x="160" y="190" font-size="11" text-anchor="middle" fill="#7a766d">(통합 부족)</text>
    <rect x="300" y="130" width="160" height="70" rx="4" fill="#ffffff" stroke="#e07a3f"/>
    <text x="380" y="154" font-size="13" text-anchor="middle" font-weight="bold">이타적 자살</text>
    <text x="380" y="174" font-size="11" text-anchor="middle">집단과 자아의 동일시</text>
    <text x="380" y="190" font-size="11" text-anchor="middle" fill="#7a766d">(통합 과잉)</text>
    <rect x="190" y="58" width="160" height="62" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="270" y="80" font-size="13" text-anchor="middle" font-weight="bold">숙명적 자살</text>
    <text x="270" y="98" font-size="11" text-anchor="middle">억압적 규율과 미래 차단</text>
    <text x="270" y="113" font-size="11" text-anchor="middle" fill="#2f5d50">(규제 과잉)</text>
    <rect x="190" y="210" width="160" height="62" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="270" y="232" font-size="13" text-anchor="middle" font-weight="bold">아노미적 자살</text>
    <text x="270" y="250" font-size="11" text-anchor="middle">급변기 규범 상실·욕망 폭주</text>
    <text x="270" y="265" font-size="11" text-anchor="middle" fill="#e07a3f">(규제 부족)</text>
  </g>
</svg>
