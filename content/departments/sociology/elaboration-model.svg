<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">라자스펠드 정교화 분석: 허위관계와 매개관계 비교</text>
    <rect x="25" y="48" width="235" height="245" rx="4" fill="#ffffff" stroke="#e07a3f"/>
    <text x="142" y="70" font-size="13" text-anchor="middle" font-weight="bold" fill="#e07a3f">모형 1: 허위관계 (Spuriousness)</text>
    <rect x="92" y="85" width="100" height="36" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="142" y="108" font-size="12" text-anchor="middle" font-weight="bold">선행변인 Z</text>
    <rect x="40" y="160" width="85" height="36" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="82" y="183" font-size="12" text-anchor="middle" font-weight="bold">독립변인 X</text>
    <rect x="160" y="160" width="85" height="36" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="202" y="183" font-size="12" text-anchor="middle" font-weight="bold">종속변인 Y</text>
    <line x1="120" y1="121" x2="85" y2="160" stroke="#e07a3f" stroke-width="2"/>
    <line x1="165" y1="121" x2="200" y2="160" stroke="#e07a3f" stroke-width="2"/>
    <line x1="125" y1="178" x2="160" y2="178" stroke="#7a766d" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="142" y="172" font-size="12" text-anchor="middle" font-weight="bold" fill="#b3261e">0</text>
    <text x="142" y="222" font-size="11" text-anchor="middle">Z가 X와 Y의 공통 원인 (시간: Z → X, Y)</text>
    <text x="142" y="242" font-size="11" text-anchor="middle" font-weight="bold">Z를 통제하면 X-Y 부분상관이 0으로 소멸</text>
    <text x="142" y="262" font-size="10" text-anchor="middle" fill="#7a766d">예: 화재 규모(Z) → 소방차 수(X), 피해액(Y)</text>
    <text x="142" y="280" font-size="11" text-anchor="middle" font-weight="bold" fill="#b3261e">결론: X는 Y의 진짜 원인이 아님</text>
    <rect x="280" y="48" width="235" height="245" rx="4" fill="#ffffff" stroke="#2f5d50"/>
    <text x="397" y="70" font-size="13" text-anchor="middle" font-weight="bold" fill="#2f5d50">모형 2: 매개관계 (Mediation)</text>
    <rect x="347" y="85" width="100" height="36" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="397" y="108" font-size="12" text-anchor="middle" font-weight="bold">매개변인 Z</text>
    <rect x="295" y="160" width="85" height="36" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="337" y="183" font-size="12" text-anchor="middle" font-weight="bold">독립변인 X</text>
    <rect x="415" y="160" width="85" height="36" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="457" y="183" font-size="12" text-anchor="middle" font-weight="bold">종속변인 Y</text>
    <line x1="340" y1="160" x2="375" y2="121" stroke="#2f5d50" stroke-width="2"/>
    <line x1="420" y1="121" x2="455" y2="160" stroke="#2f5d50" stroke-width="2"/>
    <line x1="380" y1="178" x2="415" y2="178" stroke="#7a766d" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="397" y="172" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">0</text>
    <text x="397" y="222" font-size="11" text-anchor="middle">X가 Z를 거쳐 Y를 낳음 (시간: X → Z → Y)</text>
    <text x="397" y="242" font-size="11" text-anchor="middle" font-weight="bold">Z를 통제하면 X-Y 직접효과는 0으로 감소</text>
    <text x="397" y="262" font-size="10" text-anchor="middle" fill="#7a766d">예: 부모 소득(X) → 자녀 학력(Z) → 자녀 소득(Y)</text>
    <text x="397" y="280" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">결론: 간접 인과 사슬(메커니즘)이 입증됨</text>
  </g>
</svg>
