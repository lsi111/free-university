<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <rect width="360" height="200" fill="#f4efe6"/>
  <text x="180" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d1c1a">고전적 조건형성의 세 단계</text>
  <g fill="none" stroke="#7a766d" stroke-width="1.5"><rect x="8" y="34" width="100" height="136" rx="6"/><rect x="130" y="34" width="100" height="136" rx="6"/><rect x="252" y="34" width="100" height="136" rx="6" stroke="#e07a3f" stroke-width="2.5"/></g>
  <g font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle">
    <text x="58" y="56" font-size="13" font-weight="bold">① 조건형성 전</text>
    <text x="58" y="84">종소리</text><text x="58" y="102">→ 침 안 나옴</text>
    <text x="58" y="128">먹이</text><text x="58" y="146">→ 침 분비</text>
    <text x="180" y="56" font-size="13" font-weight="bold">② 짝짓기</text>
    <text x="180" y="84">종소리+먹이</text><text x="180" y="102">함께, 여러 번</text>
    <text x="180" y="128">→ 침 분비</text>
    <text x="302" y="56" font-size="13" font-weight="bold">③ 조건형성 후</text>
    <text x="302" y="84">종소리만</text><text x="302" y="102">→ 침 분비</text>
    <text x="119" y="106" font-size="14" fill="#2f5d50">▶</text><text x="241" y="106" font-size="14" fill="#2f5d50">▶</text>
    <text x="180" y="190" font-size="11">먹이 = 무조건 자극, 종소리 = 학습 뒤의 조건 자극</text>
  </g>
</svg>
