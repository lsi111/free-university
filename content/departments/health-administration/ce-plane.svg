<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">비용-효과 평면(CE Plane)의 4사분면과 ICER 판정</text>
    <rect x="40" y="45" width="290" height="220" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <line x1="40" y1="155" x2="330" y2="155" stroke="#1d1c1a" stroke-width="2"/>
    <line x1="185" y1="45" x2="185" y2="265" stroke="#1d1c1a" stroke-width="2"/>
    <line x1="115" y1="225" x2="295" y2="65" stroke="#e07a3f" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="185" y="60" font-size="11" text-anchor="middle" font-weight="bold">+ΔC (비용 증가)</text>
    <text x="185" y="258" font-size="11" text-anchor="middle" font-weight="bold">-ΔC (비용 절감)</text>
    <text x="290" y="148" font-size="11" text-anchor="middle" font-weight="bold">+ΔE (효과 증가)</text>
    <text x="90" y="148" font-size="11" text-anchor="middle" font-weight="bold">-ΔE (효과 감소)</text>
    <rect x="52" y="68" width="120" height="56" rx="4" fill="#fbe6e1" stroke="#b3261e"/>
    <text x="112" y="92" font-size="12" text-anchor="middle" font-weight="bold" fill="#b3261e">서북(NW): 열등</text>
    <text x="112" y="110" font-size="10" text-anchor="middle">비용↑ 효과↓ (기각)</text>
    <rect x="198" y="68" width="120" height="56" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="258" y="92" font-size="12" text-anchor="middle" font-weight="bold">동북(NE): 상충</text>
    <text x="258" y="110" font-size="10" text-anchor="middle">비용↑ 효과↑ (ICER 비교)</text>
    <rect x="52" y="172" width="120" height="56" rx="4" fill="#f4e9d6" stroke="#7a766d"/>
    <text x="112" y="196" font-size="12" text-anchor="middle" font-weight="bold">서남(SW): 상충</text>
    <text x="112" y="214" font-size="10" text-anchor="middle">비용↓ 효과↓</text>
    <rect x="198" y="172" width="120" height="56" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="258" y="196" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f5d50">동남(SE): 우월</text>
    <text x="258" y="214" font-size="10" text-anchor="middle">비용↓ 효과↑ (즉시 채택)</text>
    <rect x="345" y="45" width="175" height="220" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="432" y="70" font-size="13" text-anchor="middle" font-weight="bold">ICER 의사결정 규칙</text>
    <text x="432" y="98" font-size="12" text-anchor="middle" font-weight="bold">ICER = ΔC / ΔE</text>
    <text x="432" y="124" font-size="11" text-anchor="middle">임계값 λ (지불의사 한계)</text>
    <text x="432" y="146" font-size="11" text-anchor="middle" fill="#e07a3f">점선 기울기 = λ</text>
    <text x="432" y="176" font-size="11" text-anchor="middle">• 동북(NE) 사분면에서</text>
    <text x="432" y="196" font-size="11" text-anchor="middle" font-weight="bold">ICER ≤ λ 이면</text>
    <text x="432" y="216" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">비용-효과적 (채택)</text>
    <text x="432" y="242" font-size="10" text-anchor="middle" fill="#b3261e">• 서북(NW)은 계산 없이 기각</text>
    <text x="270" y="295" font-size="11" text-anchor="middle" font-weight="bold">동남(SE) 사분면의 대안은 기존 치료보다 효과는 크고 비용은 적어 지배적 우월(Dominant) 대안이다</text>
  </g>
</svg>
