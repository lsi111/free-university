<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
<rect width="360" height="200" fill="#f4efe6"/>
<text x="180" y="24" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a" font-weight="bold">가상 마을 조사 (단위: 명)</text>
<rect x="10" y="40" width="100" height="40" fill="#e8e0d0" stroke="#7a766d" stroke-width="1.5"/>
<rect x="110" y="40" width="80" height="40" fill="#e8e0d0" stroke="#7a766d" stroke-width="1.5"/>
<text x="150" y="65" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a" font-weight="bold">복통 있음</text>
<rect x="190" y="40" width="80" height="40" fill="#e8e0d0" stroke="#7a766d" stroke-width="1.5"/>
<text x="230" y="65" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a" font-weight="bold">복통 없음</text>
<rect x="270" y="40" width="80" height="40" fill="#e8e0d0" stroke="#7a766d" stroke-width="1.5"/>
<text x="310" y="65" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a" font-weight="bold">합계</text>
<rect x="10" y="80" width="100" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="60" y="105" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a" font-weight="bold">우물물 마심</text>
<rect x="110" y="80" width="80" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="150" y="105" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">40</text>
<rect x="190" y="80" width="80" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="230" y="105" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">160</text>
<rect x="270" y="80" width="80" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="310" y="105" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">200</text>
<rect x="10" y="120" width="100" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="60" y="145" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a" font-weight="bold">마시지 않음</text>
<rect x="110" y="120" width="80" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="150" y="145" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">15</text>
<rect x="190" y="120" width="80" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="230" y="145" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">285</text>
<rect x="270" y="120" width="80" height="40" fill="#fffaf0" stroke="#7a766d" stroke-width="1.5"/>
<text x="310" y="145" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">300</text>
<text x="10" y="182" font-family="sans-serif" font-size="11" text-anchor="start" fill="#7a766d">복통은 가상의 증상 예시이며 수치는 지어낸 것이다.</text>
</svg>
