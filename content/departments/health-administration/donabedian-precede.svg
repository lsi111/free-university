<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">도나베디안 의료 질 모형과 PRECEDE 교육·생태학적 진단</text>
    <text x="270" y="52" font-size="13" text-anchor="middle" font-weight="bold">1. 도나베디안(Donabedian)의 의료 질 평가 3단계 사슬</text>
    <rect x="25" y="64" width="150" height="62" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="100" y="88" font-size="13" text-anchor="middle" font-weight="bold">구조 (Structure)</text>
    <text x="100" y="110" font-size="11" text-anchor="middle">인력·시설·장비·조직</text>
    <rect x="195" y="64" width="150" height="62" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="270" y="88" font-size="13" text-anchor="middle" font-weight="bold">과정 (Process)</text>
    <text x="270" y="110" font-size="11" text-anchor="middle">지침 준수·처방·손위생</text>
    <rect x="365" y="64" width="150" height="62" rx="4" fill="#e3efe9" stroke="#2f5d50"/>
    <text x="440" y="88" font-size="13" text-anchor="middle" font-weight="bold">결과 (Outcome)</text>
    <text x="440" y="110" font-size="11" text-anchor="middle">사망률·합병증·만족도</text>
    <path d="M175 95 L195 95 M345 95 L365 95" stroke="#1d1c1a" stroke-width="2"/>
    <text x="270" y="156" font-size="13" text-anchor="middle" font-weight="bold">2. 그린(Green)의 PRECEDE 모형: 건강행동을 결정하는 3대 요인</text>
    <rect x="25" y="170" width="150" height="86" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="100" y="194" font-size="11" text-anchor="middle" font-weight="bold">소인성 요인 (Predisposing)</text>
    <text x="100" y="218" font-size="11" text-anchor="middle" fill="#2f5d50">지식 · 태도 · 신념 · 가치관</text>
    <text x="100" y="240" font-size="10" text-anchor="middle">행동 변화의 내적 동기 부여</text>
    <rect x="195" y="170" width="150" height="86" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="270" y="194" font-size="11" text-anchor="middle" font-weight="bold">가능성 요인 (Enabling)</text>
    <text x="270" y="218" font-size="11" text-anchor="middle" fill="#2f5d50">시설 · 비용 지원 · 기술 · 접근성</text>
    <text x="270" y="240" font-size="10" text-anchor="middle">행동을 실현하게 하는 환경 자원</text>
    <rect x="365" y="170" width="150" height="86" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="440" y="194" font-size="11" text-anchor="middle" font-weight="bold">강화 요인 (Reinforcing)</text>
    <text x="440" y="218" font-size="11" text-anchor="middle" fill="#2f5d50">가족 · 동료 지지 · 의료진 피드백</text>
    <text x="440" y="240" font-size="10" text-anchor="middle">행동을 지속·반복시키는 보상</text>
    <text x="270" y="286" font-size="11" text-anchor="middle" font-weight="bold">사회적·역학적 진단 → 행동·환경적 진단 → 교육·생태학적 진단(3요인) → 행정·정책적 진단</text>
  </g>
</svg>
