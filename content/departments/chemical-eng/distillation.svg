<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
<rect width="400" height="225" fill="#f4efe6"/>
<text x="180" y="20" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a" font-weight="bold">증류탑</text>
<rect x="135" y="28" width="90" height="152" rx="6" fill="#fbf8f2" stroke="#2f5d50" stroke-width="2"/>
<text x="180" y="58" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#1d1c1a">위: 서늘</text>
<text x="180" y="160" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#1d1c1a">아래: 뜨거움</text>
<line x1="35" y1="110" x2="125.0" y2="110.0" stroke="#2f5d50" stroke-width="2"/><polygon points="133,110 125.0,114.0 125.0,106.0" fill="#2f5d50"/>
<text x="80" y="100" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">혼합물</text>
<text x="80" y="128" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">A와 B</text>
<line x1="227" y1="50" x2="292.0" y2="50.0" stroke="#e07a3f" stroke-width="2"/><polygon points="300,50 292.0,54.0 292.0,46.0" fill="#e07a3f"/>
<text x="304" y="47" font-family="sans-serif" font-size="12" text-anchor="start" fill="#1d1c1a">A: 가벼운 쪽</text>
<text x="304" y="63" font-family="sans-serif" font-size="12" text-anchor="start" fill="#1d1c1a">끓는점 60°C</text>
<line x1="227" y1="165" x2="292.0" y2="165.0" stroke="#2f5d50" stroke-width="2"/><polygon points="300,165 292.0,169.0 292.0,161.0" fill="#2f5d50"/>
<text x="304" y="162" font-family="sans-serif" font-size="12" text-anchor="start" fill="#1d1c1a">B: 무거운 쪽</text>
<text x="304" y="178" font-family="sans-serif" font-size="12" text-anchor="start" fill="#1d1c1a">끓는점 100°C</text>
<text x="200" y="210" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">끓는점 차이로 가른다</text>
</svg>
