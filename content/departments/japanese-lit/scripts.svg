<text x="25" y="175" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">한 = 한자</text>
<text x="135" y="175" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">히 = 히라가나</text>
<text x="255" y="175" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1c1a">가 = 가타카나</text>
