<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">일본 근현대 문학의 사조 분화와 주요 작가 계보</text>
    <rect x="20" y="45" width="500" height="30" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="75" y="65" font-size="11" text-anchor="middle" font-weight="bold">시기 구분</text>
    <text x="215" y="65" font-size="11" text-anchor="middle" font-weight="bold">핵심 문학 사조·운동</text>
    <text x="385" y="65" font-size="11" text-anchor="middle" font-weight="bold">대표 작가 및 작품</text>
    <text x="485" y="65" font-size="11" text-anchor="middle" font-weight="bold">서사·비평 키워드</text>
    <rect x="20" y="75" width="500" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="75" y="96" font-size="11" text-anchor="middle" font-weight="bold">메이지 초기~중기</text>
    <text x="215" y="96" font-size="10" text-anchor="middle">언문일치 운동 · 사실주의 이식</text>
    <text x="385" y="96" font-size="10" text-anchor="middle" font-weight="bold">후타바테이 시메이 《뜬구름》 / 쓰보우치 쇼요</text>
    <text x="485" y="96" font-size="10" text-anchor="middle">근대 내면 발견</text>
    <rect x="20" y="109" width="500" height="34" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="75" y="130" font-size="11" text-anchor="middle" font-weight="bold">메이지 말기</text>
    <text x="215" y="130" font-size="10" text-anchor="middle">자연주의 vs 반자연주의(여유파)</text>
    <text x="385" y="130" font-size="10" text-anchor="middle" font-weight="bold" fill="#2f5d50">다야마 가타이 《이불》 / 소세키 《마음》·오가이</text>
    <text x="485" y="130" font-size="10" text-anchor="middle">사소설 vs 지성</text>
    <rect x="20" y="143" width="500" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="75" y="164" font-size="11" text-anchor="middle" font-weight="bold">다이쇼~쇼와 초</text>
    <text x="215" y="164" font-size="10" text-anchor="middle">탐미파·신사조파·신감각파·프롤레타리아</text>
    <text x="385" y="164" font-size="10" text-anchor="middle" font-weight="bold">아쿠타가와 〈라쇼몬〉 / 가와바타 《설국》</text>
    <text x="485" y="164" font-size="10" text-anchor="middle">단편 미학·감각</text>
    <rect x="20" y="177" width="500" height="34" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="75" y="198" font-size="11" text-anchor="middle" font-weight="bold">패전 직후 (1945~)</text>
    <text x="215" y="198" font-size="10" text-anchor="middle">무뢰파(데카당스) · 제1·2차 전후파</text>
    <text x="385" y="198" font-size="10" text-anchor="middle" font-weight="bold">다자이 오사무 《인간실격》 / 미시마·아베 고보</text>
    <text x="485" y="198" font-size="10" text-anchor="middle">전후 허무·실존</text>
    <rect x="20" y="211" width="500" height="34" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="75" y="232" font-size="11" text-anchor="middle" font-weight="bold">고도성장~현대</text>
    <text x="215" y="232" font-size="10" text-anchor="middle">전후 민주주의 · 포스트모던 · 월경문학</text>
    <text x="385" y="232" font-size="10" text-anchor="middle" font-weight="bold">오에 겐자부로 / 무라카미 하루키 / 다와다 요코</text>
    <text x="485" y="232" font-size="10" text-anchor="middle">주변부·다중언어</text>
    <rect x="20" y="255" width="500" height="48" rx="4" fill="#fdf0d5" stroke="#e07a3f"/>
    <text x="270" y="275" font-size="11" text-anchor="middle" font-weight="bold">일본 노벨문학상 수상 계보: 가와바타 야스나리(1968, 전통 미학의 정수) → 오에 겐자부로(1994, 전후 인류 보편성)</text>
    <text x="270" y="294" font-size="11" text-anchor="middle">일본 자연주의의 특수성: 서구 사회과학적 실험소설이 작가 개인의 사생활 고백록인 '사소설(私小説)'로 굴절됨</text>
  </g>
</svg>
