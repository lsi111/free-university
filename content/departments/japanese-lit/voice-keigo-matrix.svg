<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <rect width="540" height="320" fill="#f4efe6" rx="8"/>
  <g font-family="sans-serif" fill="#1d1c1a">
    <text x="270" y="26" font-size="15" text-anchor="middle" font-weight="bold">일본어의 태(수동·사역) 논항 교체와 경어 5분류 체계</text>
    <rect x="20" y="45" width="500" height="118" rx="4" fill="#e9e1cf" stroke="#7a766d"/>
    <text x="270" y="65" font-size="12" text-anchor="middle" font-weight="bold">태(ヴォイス)의 4유형과 격조사(が·に·を) 배치</text>
    <text x="75" y="86" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">직접 수동</text>
    <text x="310" y="86" font-size="10" text-anchor="middle">타동사 목적어가 주어로 승격: 先生が 学生を ほめた → 学生が 先生に ほめられた</text>
    <text x="75" y="104" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">간접(피해) 수동</text>
    <text x="310" y="104" font-size="10" text-anchor="middle">자동사나 소유물 대상도 가능(논항 추가): 雨が 降った → 私は 雨に 降られた (피해 감정)</text>
    <text x="75" y="122" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">사역 (使役)</text>
    <text x="310" y="122" font-size="10" text-anchor="middle">타동사 사역(동작주+に): 学生に 本を 読ませる / 자동사 사역(を·に): 学生を(に) 行かせる</text>
    <text x="75" y="140" font-size="11" text-anchor="middle" font-weight="bold" fill="#2f5d50">사역수동</text>
    <text x="310" y="140" font-size="10" text-anchor="middle">원치 않는 행위를 강요받음: 私は 母に 野菜を 食べさせられた (1류 축약형: 読まされた)</text>
    <rect x="20" y="175" width="500" height="26" rx="4" fill="#d9d2c2" stroke="#7a766d"/>
    <text x="80" y="193" font-size="11" text-anchor="middle" font-weight="bold">경어 분류 (2007 지침)</text>
    <text x="215" y="193" font-size="11" text-anchor="middle" font-weight="bold">높임의 대상·기능</text>
    <text x="370" y="193" font-size="11" text-anchor="middle" font-weight="bold">대표 어휘·형식</text>
    <text x="480" y="193" font-size="11" text-anchor="middle" font-weight="bold">성격</text>
    <rect x="20" y="201" width="500" height="26" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="80" y="218" font-size="11" text-anchor="middle" font-weight="bold">존경어 (尊敬語)</text>
    <text x="215" y="218" font-size="10" text-anchor="middle">동작 주체(주어)를 높임</text>
    <text x="370" y="218" font-size="10" text-anchor="middle" font-weight="bold">いらっしゃる·おっしゃる / お(ご)~になる</text>
    <text x="480" y="218" font-size="10" text-anchor="middle">주체경어</text>
    <rect x="20" y="227" width="500" height="26" rx="4" fill="#e3efe9" stroke="#7a766d"/>
    <text x="80" y="244" font-size="11" text-anchor="middle" font-weight="bold">겸양어 I (謙譲語 I)</text>
    <text x="215" y="244" font-size="10" text-anchor="middle">동작이 향하는 객체(여격·목적어)를 높임</text>
    <text x="370" y="244" font-size="10" text-anchor="middle" font-weight="bold" fill="#2f5d50">伺う·申し上げる / お(ご)~する</text>
    <text x="480" y="244" font-size="10" text-anchor="middle">객체경어</text>
    <rect x="20" y="253" width="500" height="26" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="80" y="270" font-size="11" text-anchor="middle" font-weight="bold">겸양어 II (丁重語)</text>
    <text x="215" y="270" font-size="10" text-anchor="middle">청자에게 자신의 동작을 정중히 낮춤</text>
    <text x="370" y="270" font-size="10" text-anchor="middle" font-weight="bold">参る·申す·いたす·おり(おる)</text>
    <text x="480" y="270" font-size="10" text-anchor="middle">대자경어</text>
    <rect x="20" y="279" width="500" height="26" rx="4" fill="#ffffff" stroke="#7a766d"/>
    <text x="80" y="296" font-size="11" text-anchor="middle" font-weight="bold">정중어·미화어</text>
    <text x="215" y="296" font-size="10" text-anchor="middle">청자 대우(です·ます) / 품위 유지(お酒·ご本)</text>
    <text x="370" y="296" font-size="10" text-anchor="middle" font-weight="bold">です·ます·ございます / お·ご+명사</text>
    <text x="480" y="296" font-size="10" text-anchor="middle">청자·품위</text>
  </g>
</svg>
