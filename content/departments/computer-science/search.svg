  <g text-anchor="middle" fill="#7a766d">
    <text x="41" y="70">1번</text><text x="88" y="70">2번</text><text x="135" y="70">3번</text><text x="182" y="70">4번</text><text x="229" y="70">5번</text><text x="276" y="70">6번</text><text x="323" y="70">7번</text>
  </g>
  <g stroke="#1d1c1a" stroke-width="1.5">
    <rect x="20" y="80" width="42" height="40" fill="#cfe0d8"/><rect x="67" y="80" width="42" height="40" fill="#cfe0d8"/>
    <rect x="114" y="80" width="42" height="40" fill="#cfe0d8"/><rect x="161" y="80" width="42" height="40" fill="#f6d9c4"/>
    <rect x="208" y="80" width="42" height="40" fill="#cfe0d8"/><rect x="255" y="80" width="42" height="40" fill="#cfe0d8"/>
