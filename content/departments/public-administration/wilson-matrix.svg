<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="380" height="300">
<rect width="380" height="300" fill="#f4efe6"/>
<text x="190.0" y="22.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">윌슨의 정책 정치 유형 (비용·편익의 분포)</text>
<text x="157.0" y="55.0" font-family="sans-serif" font-size="12" fill="#7a766d" text-anchor="middle" font-weight="bold">비용 집중</text>
<text x="302.0" y="55.0" font-family="sans-serif" font-size="12" fill="#7a766d" text-anchor="middle" font-weight="bold">비용 분산</text>
<text x="48.0" y="120.0" font-family="sans-serif" font-size="12" fill="#7a766d" text-anchor="middle" font-weight="bold">편익 집중</text>
<text x="48.0" y="225.0" font-family="sans-serif" font-size="12" fill="#7a766d" text-anchor="middle" font-weight="bold">편익 분산</text>
<rect x="90.0" y="65.0" width="135.0" height="100.0" rx="4" fill="#cfe0d8" stroke="#7a766d" stroke-width="1.5"/>
<text x="157.5" y="113.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">이익집단정치</text>
<text x="157.5" y="135.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">양쪽이 조직되어 맞섬</text>
<rect x="235.0" y="65.0" width="135.0" height="100.0" rx="4" fill="#f6d9c4" stroke="#7a766d" stroke-width="1.5"/>
<text x="302.5" y="113.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">고객정치</text>
<text x="302.5" y="135.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">수혜 집단이 주도</text>
<rect x="90.0" y="175.0" width="135.0" height="100.0" rx="4" fill="#f6d9c4" stroke="#7a766d" stroke-width="1.5"/>
<text x="157.5" y="223.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">기업가정치</text>
<text x="157.5" y="245.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">정책 기업가가 필요</text>
<rect x="235.0" y="175.0" width="135.0" height="100.0" rx="4" fill="#cfe0d8" stroke="#7a766d" stroke-width="1.5"/>
<text x="302.5" y="223.0" font-family="sans-serif" font-size="14" fill="#1d1c1a" text-anchor="middle" font-weight="bold">대중정치</text>
<text x="302.5" y="245.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">조직된 압력이 약함</text>
</svg>
