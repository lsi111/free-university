<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230">
<rect width="380" height="230" fill="#f4efe6"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7a766d"/></marker></defs>
<rect x="15" y="15" width="350" height="55" fill="#fffaf0" stroke="#2f5d50" stroke-width="1.5"/>
<text x="70" y="48" font-family="sans-serif" fill="#1d1c1a" font-size="13" text-anchor="middle">바라는 것</text>
<text x="240" y="48" font-family="sans-serif" fill="#1d1c1a" font-size="12" text-anchor="middle">기차를 놓치지 않으려 한다</text>
<path d="M190 70 V83" stroke="#7a766d" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="15" y="85" width="350" height="55" fill="#fffaf0" stroke="#e07a3f" stroke-width="1.5"/>
<text x="70" y="118" font-family="sans-serif" fill="#1d1c1a" font-size="13" text-anchor="middle">가로막는 것</text>
<text x="240" y="118" font-family="sans-serif" fill="#1d1c1a" font-size="12" text-anchor="middle">짐이 무거워 걸음이 느리다</text>
<path d="M190 140 V153" stroke="#7a766d" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="15" y="155" width="350" height="55" fill="#fffaf0" stroke="#2f5d50" stroke-width="1.5"/>
<text x="70" y="188" font-family="sans-serif" fill="#1d1c1a" font-size="13" text-anchor="middle">몸짓과 행동</text>
<text x="240" y="188" font-family="sans-serif" fill="#1d1c1a" font-size="12" text-anchor="middle">짐을 끌며 뛰다가 시계를 본다</text>
</svg>
