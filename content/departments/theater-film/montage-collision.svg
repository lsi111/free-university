<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
<rect width="400" height="240" fill="#f4efe6"/>
<text x="200.0" y="22.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="middle" font-weight="bold">에이젠슈테인의 변증법적 충돌 몽타주(Collision Montage)</text>
<rect x="40.0" y="50.0" width="120.0" height="70.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="100.0" y="75.0" font-family="sans-serif" font-size="11" fill="#2f5d50" text-anchor="middle" font-weight="bold">쇼트 A (정 テー제)</text>
<text x="100.0" y="95.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">굶주린 노동자들의 시위</text>
<rect x="240.0" y="50.0" width="120.0" height="70.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="300.0" y="75.0" font-family="sans-serif" font-size="11" fill="#e07a3f" text-anchor="middle" font-weight="bold">쇼트 B (반 アンチテー제)</text>
<text x="300.0" y="95.0" font-family="sans-serif" font-size="10" fill="#1d1c1a" text-anchor="middle">도살장에서 도살되는 황소</text>
<text x="200.0" y="85.0" font-family="sans-serif" font-size="14" fill="#e53e3e" text-anchor="middle" font-weight="bold">× 충돌</text>
<line x1="100.0" y1="120.0" x2="170.0" y2="160.0" stroke="#2f5d50" stroke-width="2"/>
<polygon points="170.0,160.0 162.1,159.0 165.1,153.6" fill="#2f5d50"/>
<line x1="300.0" y1="120.0" x2="230.0" y2="160.0" stroke="#e07a3f" stroke-width="2"/>
<polygon points="230.0,160.0 234.9,153.6 237.9,159.0" fill="#e07a3f"/>
<rect x="100.0" y="160.0" width="200.0" height="60.0" rx="4" fill="#ffffff" stroke="#805ad5" stroke-width="2"/>
<text x="200.0" y="185.0" font-family="sans-serif" font-size="12" fill="#805ad5" text-anchor="middle" font-weight="bold">새로운 종합 의미 C (합 ジンテー제)</text>
<text x="200.0" y="205.0" font-family="sans-serif" font-size="11" fill="#1d1c1a" text-anchor="middle">"자본 권력에 의한 민중 학살의 잔혹성"</text>
<text x="200.0" y="235.0" font-family="sans-serif" font-size="10" fill="#7a766d" text-anchor="middle">두 쇼트의 충돌이 제3의 추상적·지적 개념을 관객의 두뇌에 촉발</text>
</svg>
