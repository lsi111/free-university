<svg xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" viewBox="0 0 360 240" width="360" height="240">
  <rect width="360" height="240" fill="#f4efe6"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a766d"/></marker></defs>
  <text x="180" y="26" font-size="14" font-weight="700" fill="#1d1c1a" text-anchor="middle">경영의 네 기능과 순환</text>
