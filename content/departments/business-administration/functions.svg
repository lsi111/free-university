    <line x1="160" y1="72" x2="198" y2="72"/><line x1="270" y1="98" x2="270" y2="146"/>
    <line x1="200" y1="178" x2="162" y2="178"/><line x1="90" y1="152" x2="90" y2="100"/>
  </g>
  <g fill="#f4efe6" stroke="#2f5d50" stroke-width="2">
