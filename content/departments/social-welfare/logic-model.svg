<text x="120.0" y="115.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">주 2회 안부 방문, 식사 배달,</text>
<text x="120.0" y="132.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">월 1회 이웃 모임</text>
