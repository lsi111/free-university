<rect x="14.0" y="276.0" width="84.0" height="46.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="56.0" y="304.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">장기 성과</text>
<rect x="108.0" y="276.0" width="278.0" height="46.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="120.0" y="295.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">살던 지역에서</text>
<text x="120.0" y="312.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">안정적으로 생활함</text>
