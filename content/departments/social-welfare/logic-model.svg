<rect x="14.0" y="36.0" width="84.0" height="46.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="56.0" y="64.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">투입</text>
<rect x="108.0" y="36.0" width="278.0" height="46.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="120.0" y="55.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">직원 3명, 예산 6,000만원,</text>
<text x="120.0" y="72.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">자원봉사자 20명</text>
