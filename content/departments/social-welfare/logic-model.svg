<rect x="14.0" y="96.0" width="84.0" height="46.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="56.0" y="124.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">활동</text>
