<rect x="14.0" y="216.0" width="84.0" height="46.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="56.0" y="244.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">단기 성과</text>
<rect x="108.0" y="216.0" width="278.0" height="46.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
