<rect x="14.0" y="156.0" width="84.0" height="46.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="56.0" y="184.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle" font-weight="bold">산출</text>
<rect x="108.0" y="156.0" width="278.0" height="46.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="120.0" y="175.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">방문 1,200회, 식사 2,400끼,</text>
<text x="120.0" y="192.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">참여 어르신 50명</text>
