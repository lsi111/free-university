<text x="190" y="222" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">사회 문제로 다루게 된다</text>
<text x="180" y="262" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">넷째 단계는 셋째 단계가 있을 때 더 힘을 받는다.</text>
