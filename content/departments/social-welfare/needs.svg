<text x="190" y="102" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">충족할 자원이 모자란다</text>
<line x1="180" y1="116" x2="180" y2="132" stroke="#7a766d" stroke-width="2"/>
<polygon points="174,128 186,128 180,136" fill="#7a766d"/>
