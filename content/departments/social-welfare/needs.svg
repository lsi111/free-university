<text x="190" y="42" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1a">욕구가 생긴다</text>
<line x1="180" y1="56" x2="180" y2="72" stroke="#7a766d" stroke-width="2"/>
<polygon points="174,68 186,68 180,76" fill="#7a766d"/>
