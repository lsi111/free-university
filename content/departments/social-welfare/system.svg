<text x="66" y="134" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">받는 조건</text>
<text x="66" y="154" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">위험이 닥칠</text>
<text x="66" y="171" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">때 (예: 실업)</text>
