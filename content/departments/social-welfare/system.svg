<text x="190" y="154" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">소득·재산이</text>
<text x="190" y="171" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">기준 아래일 때</text>
