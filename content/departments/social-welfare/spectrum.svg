<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 206" width="380" height="206">
<rect width="380" height="206" fill="#f4efe6"/>
<text x="20" y="30" font-family="sans-serif" font-size="14" text-anchor="start" fill="#e07a3f" font-weight="bold">잔여적 시각</text>
<text x="360" y="30" font-family="sans-serif" font-size="14" text-anchor="end" fill="#2f5d50" font-weight="bold">제도적 시각</text>
<line x1="40" y1="110" x2="340" y2="110" stroke="#7a766d" stroke-width="3"/>
<line x1="40" y1="100" x2="40" y2="120" stroke="#7a766d" stroke-width="3"/>
<line x1="340" y1="100" x2="340" y2="120" stroke="#7a766d" stroke-width="3"/>
<circle cx="80" cy="110" r="15" fill="#fffaf0" stroke="#e07a3f" stroke-width="3"/>
<text x="80" y="115" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1d1c1a" font-weight="bold">가</text>
<text x="80" y="148" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">가국</text>
<circle cx="185" cy="110" r="15" fill="#fffaf0" stroke="#7a766d" stroke-width="3"/>
<text x="185" y="115" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1d1c1a" font-weight="bold">나</text>
<text x="185" y="148" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">나국</text>
<circle cx="290" cy="110" r="15" fill="#fffaf0" stroke="#2f5d50" stroke-width="3"/>
<text x="290" y="115" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1d1c1a" font-weight="bold">다</text>
<text x="290" y="148" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1c1a">다국</text>
<text x="20" y="58" font-family="sans-serif" font-size="12" text-anchor="start" fill="#1d1c1a">가족·시장이 먼저</text>
<text x="20" y="76" font-family="sans-serif" font-size="12" text-anchor="start" fill="#1d1c1a">어려울 때 국가가 보충</text>
<text x="360" y="58" font-family="sans-serif" font-size="12" text-anchor="end" fill="#1d1c1a">복지는 모두의 기본 제도</text>
<text x="360" y="76" font-family="sans-serif" font-size="12" text-anchor="end" fill="#1d1c1a">국가가 평소에 맡는다</text>
<text x="190" y="190" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#7a766d">세 나라의 위치는 설명용 가상 예다.</text>
</svg>
