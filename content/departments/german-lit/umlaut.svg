<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 246" width="380" height="246">
<rect width="380" height="246" fill="#f4efe6"/>
<text x="190" y="22" font-size="13" text-anchor="middle" font-family="sans-serif" fill="#7a766d">특수 글자와 낱말 (읽기는 한글 근사)</text>
<rect x="20" y="36" width="340" height="38" rx="5" fill="#2f5d50" fill-opacity="0.14" stroke="#2f5d50" stroke-width="1.5"/>
<text x="46" y="63" font-size="22" text-anchor="middle" font-family="sans-serif" fill="#2f5d50" font-weight="bold">ä</text>
<text x="80" y="60" font-size="15" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">Käse</text>
<text x="170" y="60" font-size="13" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">치즈</text>
<text x="262" y="60" font-size="13" text-anchor="start" font-family="sans-serif" fill="#7a766d">읽기 케제</text>
<rect x="20" y="82" width="340" height="38" rx="5" fill="#2f5d50" fill-opacity="0.14" stroke="#2f5d50" stroke-width="1.5"/>
<text x="46" y="109" font-size="22" text-anchor="middle" font-family="sans-serif" fill="#2f5d50" font-weight="bold">ö</text>
<text x="80" y="106" font-size="15" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">schön</text>
<text x="170" y="106" font-size="13" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">아름다운</text>
<text x="262" y="106" font-size="13" text-anchor="start" font-family="sans-serif" fill="#7a766d">읽기 쇤</text>
<rect x="20" y="128" width="340" height="38" rx="5" fill="#2f5d50" fill-opacity="0.14" stroke="#2f5d50" stroke-width="1.5"/>
<text x="46" y="155" font-size="22" text-anchor="middle" font-family="sans-serif" fill="#2f5d50" font-weight="bold">ü</text>
<text x="80" y="152" font-size="15" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">Tür</text>
<text x="170" y="152" font-size="13" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">문</text>
<text x="262" y="152" font-size="13" text-anchor="start" font-family="sans-serif" fill="#7a766d">읽기 튀어</text>
<rect x="20" y="174" width="340" height="38" rx="5" fill="#e07a3f" fill-opacity="0.14" stroke="#e07a3f" stroke-width="1.5"/>
<text x="46" y="201" font-size="22" text-anchor="middle" font-family="sans-serif" fill="#e07a3f" font-weight="bold">ß</text>
<text x="80" y="198" font-size="15" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">Straße</text>
<text x="170" y="198" font-size="13" text-anchor="start" font-family="sans-serif" fill="#1d1c1a">거리</text>
<text x="262" y="198" font-size="13" text-anchor="start" font-family="sans-serif" fill="#7a766d">읽기 슈트라세</text>
<text x="190" y="232" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#7a766d">ä ö ü는 점 두 개가 붙은 글자, ß는 ss와 같은 소리</text>
</svg>
