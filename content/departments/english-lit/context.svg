<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 235" width="400" height="235">
<rect width="400" height="235" fill="#f4efe6"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a766d"/></marker></defs>
<rect x="20" y="16" width="360" height="40" rx="4" fill="#2f5d50" fill-opacity="0.12" stroke="#2f5d50" stroke-width="1.5"/>
<text x="200" y="41" font-size="13" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">The trail was so ______ that we kept resting.</text>
<text x="20" y="82" font-size="12" text-anchor="start" font-family="sans-serif" fill="#7a766d">빈칸 둘레에서 단서를 찾는다</text>
<line x1="200" y1="58" x2="200" y2="96" stroke="#7a766d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="98" width="280" height="34" rx="4" fill="#e07a3f" fill-opacity="0.15" stroke="#e07a3f" stroke-width="1.5"/>
<text x="200" y="120" font-size="13" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">단서: "kept resting" (계속 쉬었다)</text>
<line x1="200" y1="134" x2="200" y2="160" stroke="#7a766d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="162" width="280" height="30" rx="4" fill="none" stroke="#7a766d" stroke-width="1.5"/>
<text x="200" y="182" font-size="13" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">추측: 힘들고 고된 길이었을 것이다</text>
<line x1="200" y1="194" x2="200" y2="208" stroke="#7a766d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="208" width="280" height="22" rx="4" fill="none" stroke="#7a766d" stroke-width="1.5"/>
<text x="200" y="224" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#1d1c1a">확인: 넣어서 다시 읽어 본다</text>
</svg>
