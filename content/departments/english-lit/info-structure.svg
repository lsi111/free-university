<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210">
<rect width="400" height="210" fill="#f4efe6"/>
<text x="14.0" y="22.0" font-family="sans-serif" font-size="12" fill="#7a766d" text-anchor="start">문장마다 구정보(초록)와 신정보(주황)를 표시했다</text>
<text x="14.0" y="64.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">문장 1</text>
<rect x="70.0" y="42.0" width="82.0" height="34.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="111.0" y="64.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">A girl</text>
<text x="111.0" y="92.0" font-family="sans-serif" font-size="11" fill="#e07a3f" text-anchor="middle">신</text>
<rect x="160.0" y="42.0" width="90.0" height="34.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
<text x="205.0" y="64.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">arrived</text>
<text x="205.0" y="92.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">-</text>
<text x="14.0" y="126.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">문장 2</text>
<rect x="70.0" y="104.0" width="82.0" height="34.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="111.0" y="126.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">The girl</text>
<text x="111.0" y="154.0" font-family="sans-serif" font-size="11" fill="#2f5d50" text-anchor="middle">구</text>
<rect x="160.0" y="104.0" width="90.0" height="34.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
<text x="205.0" y="126.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">brought</text>
<text x="205.0" y="154.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">-</text>
<rect x="258.0" y="104.0" width="90.0" height="34.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="303.0" y="126.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">a cake</text>
<text x="303.0" y="154.0" font-family="sans-serif" font-size="11" fill="#e07a3f" text-anchor="middle">신</text>
<text x="14.0" y="188.0" font-family="sans-serif" font-size="12" fill="#1d1c1a" text-anchor="start">문장 3</text>
<rect x="70.0" y="166.0" width="82.0" height="34.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="111.0" y="188.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">The cake</text>
<text x="111.0" y="216.0" font-family="sans-serif" font-size="11" fill="#2f5d50" text-anchor="middle">구</text>
<rect x="160.0" y="166.0" width="90.0" height="34.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="2"/>
<text x="205.0" y="188.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">was shared</text>
<text x="205.0" y="216.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="middle">-</text>
<rect x="258.0" y="166.0" width="90.0" height="34.0" rx="4" fill="#ffffff" stroke="#e07a3f" stroke-width="2"/>
<text x="303.0" y="188.0" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">by Jo</text>
<text x="303.0" y="216.0" font-family="sans-serif" font-size="11" fill="#e07a3f" text-anchor="middle">신</text>
<text x="14.0" y="200.0" font-family="sans-serif" font-size="11" fill="#7a766d" text-anchor="start">구 = 구정보, 신 = 신정보, - = 동사(표시하지 않음)</text>
</svg>
