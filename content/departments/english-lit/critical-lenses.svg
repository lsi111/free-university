<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270">
<rect width="400" height="270" fill="#f4efe6"/>
<text x="14.0" y="22.0" font-family="sans-serif" font-size="12" fill="#7a766d" text-anchor="start">하나의 작품을 읽는 다섯 가지 렌즈와 대표 질문</text>
<rect x="14.0" y="36.0" width="104.0" height="38.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="66.0" y="59.5" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">형식주의</text>
<rect x="126.0" y="36.0" width="262.0" height="38.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="1.5"/>
<text x="134.0" y="60.0" font-family="sans-serif" font-size="11.5" fill="#1d1c1a" text-anchor="start">형식과 이미지가 의미를 어떻게 만드는가?</text>
<rect x="14.0" y="82.0" width="104.0" height="38.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="66.0" y="105.5" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">독자반응</text>
<rect x="126.0" y="82.0" width="262.0" height="38.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="1.5"/>
<text x="134.0" y="106.0" font-family="sans-serif" font-size="11.5" fill="#1d1c1a" text-anchor="start">독자는 읽으며 의미를 어떻게 만드는가?</text>
<rect x="14.0" y="128.0" width="104.0" height="38.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="66.0" y="151.6" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">마르크스주의</text>
<rect x="126.0" y="128.0" width="262.0" height="38.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="1.5"/>
<text x="134.0" y="152.0" font-family="sans-serif" font-size="11.5" fill="#1d1c1a" text-anchor="start">계급과 경제 관계가 어떻게 드러나는가?</text>
<rect x="14.0" y="174.0" width="104.0" height="38.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="66.0" y="197.6" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">페미니즘</text>
<rect x="126.0" y="174.0" width="262.0" height="38.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="1.5"/>
<text x="134.0" y="198.0" font-family="sans-serif" font-size="11.5" fill="#1d1c1a" text-anchor="start">성별 권력과 재현은 어떻게 작동하는가?</text>
<rect x="14.0" y="220.0" width="104.0" height="38.0" rx="4" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
<text x="66.0" y="243.6" font-family="sans-serif" font-size="13" fill="#1d1c1a" text-anchor="middle">탈식민주의</text>
<rect x="126.0" y="220.0" width="262.0" height="38.0" rx="4" fill="#ffffff" stroke="#7a766d" stroke-width="1.5"/>
<text x="134.0" y="244.0" font-family="sans-serif" font-size="11.5" fill="#1d1c1a" text-anchor="start">식민 지배의 유산을 누가 어떻게 말하는가?</text>
</svg>
